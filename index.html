  );
}

// ── SubscriptionModal ──
function SubscriptionModal({sub,storeId,defaultMonth,allSubs,onClose,onSave,onDelete}){
  var isEdit=!!(sub&&sub.id);
  var [form,setForm]=useState({
    name:(sub&&sub.name)||"",
    subDate:(sub&&sub.subDate)||dateStr(new Date()),
    groupName:(sub&&sub.groupName)||"",
    reviewDone:!!(sub&&sub.reviewDone),
    memo:(sub&&sub.memo)||"",
  });
  var [err,setErr]=useState("");
  var [saving,setSaving]=useState(false);

  // allSubs는 이미 created_at desc 순으로 로드됨 → 순서 그대로 최근 등록 우선
  var recentNames=useMemo(function(){
    var seen=new Set(),result=[];
    (allSubs||[]).forEach(function(x){
      if(x.name&&!seen.has(x.name)){seen.add(x.name);result.push(x.name);}
    });
    return result.slice(0,20).sort(function(a,b){return a.localeCompare(b,"ko");});
  },[allSubs]);
  var [nameFilter,setNameFilter]=useState("");
  var knownNames=useMemo(function(){
    if(!nameFilter.trim())return recentNames;
    var q=nameFilter.trim().toLowerCase();
    var seen=new Set(),result=[];
    (allSubs||[]).forEach(function(x){
      if(x.name&&x.name.toLowerCase().indexOf(q)>=0&&!seen.has(x.name)){seen.add(x.name);result.push(x.name);}
    });
    return result.sort(function(a,b){return a.localeCompare(b,"ko");});
  },[recentNames,nameFilter,allSubs]);
  var knownGroups=useMemo(function(){
    var s=new Set((allSubs||[]).map(function(x){return x.groupName;}).filter(Boolean));
    return [...s].sort();
  },[allSubs]);

  function submit(e){
    e.preventDefault();
    if(!form.name.trim()){setErr("이름을 입력해주세요.");return;}
    setSaving(true);
    onSave({id:(sub&&sub.id)||uid(),storeId:storeId,name:form.name.trim(),subDate:form.subDate,groupName:form.groupName.trim(),reviewDone:form.reviewDone,memo:form.memo.trim()}).then(function(){setSaving(false);}).catch(function(){setSaving(false);});
  }

  return(
    <div className="modal-overlay" onClick={function(e){if(e.target===e.currentTarget)onClose();}}>
      <form className="modal-box fade-in" onSubmit={submit} style={{padding:24,color:"#1E293B"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
          <h2 style={{fontSize:16,fontWeight:700}}>{isEdit?"월정액 정보 수정":"월정액 등록"}</h2>
          <button type="button" onClick={onClose} style={{background:"none",border:"none",cursor:"pointer"}}><X size={18}/></button>
        </div>
        <div style={{marginBottom:14}}>
          <label style={{display:"block",fontSize:12,fontWeight:500,marginBottom:4}}>이름 *</label>
          <input value={form.name} onChange={function(e){setForm({...form,name:e.target.value});setNameFilter(e.target.value);setErr("");}}
            className="ml-inp" autoFocus style={{width:"100%",padding:"8px 12px",border:"1px solid "+(err?"#EF4444":"#CBD5E1"),borderRadius:6,fontSize:12,outline:"none"}} placeholder="회원 이름"/>
          {err&&<p style={{fontSize:11,color:"#EF4444",marginTop:3}}>{err}</p>}
          {knownNames.length>0&&(
            <div style={{marginTop:8}}>
              {!nameFilter.trim()&&<div style={{fontSize:9,color:"#94A3B8",marginBottom:5}}>최근 등록 {knownNames.length}명</div>}
              <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
                {knownNames.map(function(n){return(
                  <button key={n} type="button" onClick={function(){setForm({...form,name:n});setNameFilter("");setErr("");}}
                    style={{padding:"3px 10px",borderRadius:999,fontSize:10,fontWeight:600,cursor:"pointer",
                      border:"1.5px solid "+(form.name===n?"#2563EB":"#E2E8F0"),
                      background:form.name===n?"#EFF6FF":"#fff",
                      color:form.name===n?"#2563EB":"#94A3B8"}}>
                    {n}
                  </button>
                );})}
              </div>
            </div>
          )}
        </div>
        <div style={{marginBottom:14}}>
          <label style={{display:"block",fontSize:12,fontWeight:500,marginBottom:4}}>월정액 일자</label>
          <input type="date" value={form.subDate} onChange={function(e){setForm({...form,subDate:e.target.value});}}
            className="ml-inp" style={{width:"100%",padding:"8px 12px",border:"1px solid #CBD5E1",borderRadius:6,fontSize:12,outline:"none"}}/>
        </div>
        <div style={{marginBottom:14}}>
          <label style={{display:"block",fontSize:12,fontWeight:500,marginBottom:4}}>모임명</label>
          <input value={form.groupName} onChange={function(e){setForm({...form,groupName:e.target.value});}}
            className="ml-inp" style={{width:"100%",padding:"8px 12px",border:"1px solid #CBD5E1",borderRadius:6,fontSize:12,outline:"none"}} placeholder="소속 모임명"/>
          {knownGroups.length>0&&(
            <div style={{display:"flex",flexWrap:"wrap",gap:5,marginTop:8}}>
              {knownGroups.map(function(g){return(
                <button key={g} type="button" onClick={function(){setForm({...form,groupName:g});}}
                  style={{padding:"3px 10px",borderRadius:999,fontSize:10,fontWeight:600,cursor:"pointer",
                    border:"1.5px solid "+(form.groupName===g?"#2563EB":"#E2E8F0"),
                    background:form.groupName===g?"#EFF6FF":"#fff",
                    color:form.groupName===g?"#2563EB":"#94A3B8"}}>
                  {g}
                </button>
              );})}
            </div>
          )}
        </div>
        <div style={{marginBottom:14}}>
          <label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer"}}>
            <input type="checkbox" checked={form.reviewDone} onChange={function(e){setForm({...form,reviewDone:e.target.checked});}} style={{width:16,height:16,accentColor:"#2563EB",cursor:"pointer"}}/>
            <span style={{fontSize:12,fontWeight:600,color:"#1E293B"}}>리뷰 작성 완료</span>
          </label>
        </div>
        <div style={{marginBottom:20}}>
          <label style={{display:"block",fontSize:12,fontWeight:500,marginBottom:4}}>메모</label>
          <input value={form.memo} onChange={function(e){setForm({...form,memo:e.target.value});}}
            className="ml-inp" style={{width:"100%",padding:"8px 12px",border:"1px solid #CBD5E1",borderRadius:6,fontSize:12,outline:"none"}} placeholder="특이사항 등"/>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          {isEdit?(
            <button type="button" onClick={function(){onDelete(sub);}}
              style={{display:"inline-flex",alignItems:"center",gap:6,padding:"8px 14px",border:"1px solid #FECACA",borderRadius:6,fontSize:12,color:"#DC2626",background:"#FEF2F2",cursor:"pointer"}}>
              <Trash2 size={13}/> 삭제
            </button>
          ):<span/>}
          <div style={{display:"flex",gap:8}}>
            <button type="button" onClick={onClose} style={{padding:"8px 16px",border:"1px solid #CBD5E1",borderRadius:6,fontSize:12,color:"#64748B",background:"#fff",cursor:"pointer"}}>취소</button>
            <button type="submit" disabled={saving} style={{padding:"8px 18px",background:"#2563EB",color:"#fff",borderRadius:6,fontSize:12,border:"none",cursor:"pointer",opacity:saving?0.6:1}}>
              {saving?"저장 중…":isEdit?"수정":"등록"}
            </button>
          </div>
        </div>
      </form>
    </div>
  );
}

// ── SubscriptionView ──
function SubscriptionView({subs,storeId,onAdd,onItemClick}){
  var [search,setSearch]=useState("");
  var [filterGroup,setFilterGroup]=useState("all");
  var [month,setMonth]=useState(function(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1);});

  var storeSubs=useMemo(function(){return subs.filter(function(s){return s.storeId===storeId;});},[subs,storeId]);

  var months=useMemo(function(){
    var s=new Set(storeSubs.map(function(x){return x.subDate?x.subDate.slice(0,7):null;}).filter(Boolean));
    var cur=month;
    s.add(cur);
    return [...s].sort().reverse();
  },[storeSubs,month]);

  var monthSubs=useMemo(function(){
    return storeSubs.filter(function(x){return x.subDate&&x.subDate.slice(0,7)===month;});
  },[storeSubs,month]);

  var groups=useMemo(function(){
    var s=new Set(monthSubs.map(function(x){return x.groupName;}).filter(Boolean));
    return [...s].sort();
  },[monthSubs]);

  var filtered=useMemo(function(){
    var l=[...monthSubs];
    if(search.trim())l=l.filter(function(x){return x.name.toLowerCase().indexOf(search.trim().toLowerCase())>=0;});
    if(filterGroup!=="all")l=l.filter(function(x){return x.groupName===filterGroup;});
    return l.sort(function(a,b){return a.name.localeCompare(b.name,"ko");});
  },[monthSubs,search,filterGroup]);

  function prevMonth(){
    var d=new Date(month+"-01T12:00:00");d.setMonth(d.getMonth()-1);
    setMonth(d.getFullYear()+"-"+pad(d.getMonth()+1));
  }
  function nextMonth(){
    var d=new Date(month+"-01T12:00:00");d.setMonth(d.getMonth()+1);
    setMonth(d.getFullYear()+"-"+pad(d.getMonth()+1));
  }

  return(
    <div style={{display:"flex",flexDirection:"column",flex:1,overflow:"hidden"}}>
      <div style={{background:"#F8FAFC",borderBottom:"1px solid #E2E8F0",padding:"10px 16px",display:"flex",flexWrap:"wrap",alignItems:"center",gap:8,flexShrink:0}}>
        <div style={{display:"flex",alignItems:"center",gap:4}}>
          <button onClick={prevMonth} style={{display:"inline-flex",alignItems:"center",padding:"5px 8px",border:"1px solid #E2E8F0",borderRadius:6,background:"#fff",cursor:"pointer"}}><CL size={14}/></button>
          <select value={month} onChange={function(e){setMonth(e.target.value);}}
            style={{padding:"6px 10px",border:"1px solid #CBD5E1",borderRadius:6,fontSize:11,outline:"none",background:"#fff",color:"#1E293B",fontWeight:600}}>
            {months.map(function(m){return <option key={m} value={m}>{m}</option>;})}
          </select>
          <button onClick={nextMonth} style={{display:"inline-flex",alignItems:"center",padding:"5px 8px",border:"1px solid #E2E8F0",borderRadius:6,background:"#fff",cursor:"pointer"}}><CR size={14}/></button>
        </div>
        <input value={search} onChange={function(e){setSearch(e.target.value);}} placeholder="이름 검색…"
          style={{padding:"6px 12px",border:"1px solid #CBD5E1",borderRadius:6,fontSize:11,outline:"none",width:160}}/>
        <select value={filterGroup} onChange={function(e){setFilterGroup(e.target.value);}}
          style={{padding:"6px 10px",border:"1px solid #CBD5E1",borderRadius:6,fontSize:11,outline:"none",background:"#fff",color:"#1E293B"}}>
          <option value="all">전체 모임</option>
          {groups.map(function(g){return <option key={g} value={g}>{g}</option>;})}
        </select>
        <span className="ml-mono" style={{fontSize:10,color:"#94A3B8"}}>{filtered.length}명</span>
        <button onClick={function(){onAdd(month);}} style={{marginLeft:"auto",display:"inline-flex",alignItems:"center",gap:5,padding:"6px 14px",background:"#2563EB",color:"#fff",borderRadius:6,fontSize:11,fontWeight:600,border:"none",cursor:"pointer"}}><Plus size={12}/> 월정액 등록</button>
      </div>
      <div className="tbl-wrap">
        {filtered.length===0?<div style={{padding:40,textAlign:"center",fontSize:12,color:"#94A3B8"}}>{monthSubs.length===0?(month+" 등록된 월정액이 없어요."):"검색 결과가 없어요."}</div>:(
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
            <thead>
              <tr style={{background:"#334155",color:"#E2E8F0"}}>
                <th style={{padding:"10px 16px",textAlign:"left",fontWeight:600}}>이름</th>
                <th style={{padding:"10px 14px",textAlign:"center",fontWeight:600,whiteSpace:"nowrap"}}>월정액 일자</th>
                <th style={{padding:"10px 14px",textAlign:"center",fontWeight:600,whiteSpace:"nowrap"}}>모임명</th>
                <th style={{padding:"10px 14px",textAlign:"center",fontWeight:600,whiteSpace:"nowrap"}}>리뷰</th>
                <th style={{padding:"10px 14px",textAlign:"left",fontWeight:600}}>메모</th>
              </tr>
            </thead>
            <tbody>
              {filtered.map(function(s,i){return(
                <tr key={s.id} className={"ml-row "+(i%2===0?"even":"odd")} onClick={function(){onItemClick(s);}} style={{cursor:"pointer"}}>
                  <td style={{padding:"11px 16px",fontWeight:600,color:"#1E293B"}}>{s.name}</td>
                  <td className="ml-mono" style={{padding:"11px 14px",textAlign:"center",fontSize:11,color:"#374151"}}>{s.subDate||"—"}</td>
                  <td style={{padding:"11px 14px",textAlign:"center"}}>{s.groupName?<span className="tag" style={{background:"#F1F5F9",color:"#475569"}}>{s.groupName}</span>:<span style={{fontSize:11,color:"#CBD5E1"}}>—</span>}</td>
                  <td style={{padding:"11px 14px",textAlign:"center"}}>
                    {s.reviewDone
                      ?<span style={{fontSize:10,fontWeight:700,padding:"2px 10px",borderRadius:999,background:"#DCFCE7",color:"#14532D",whiteSpace:"nowrap"}}>완료</span>
                      :<span style={{fontSize:10,fontWeight:700,padding:"2px 10px",borderRadius:999,background:"#FEF3C7",color:"#92400E",whiteSpace:"nowrap"}}>미작성</span>}
                  </td>
                  <td style={{padding:"11px 16px",color:"#64748B",fontSize:11}}>{s.memo||""}</td>
                </tr>
              );})}
            </tbody>
          </table>
        )}
      </div>
    </div>
  );
}

// ── BoardWriteModal (새 글 작성) ──
function BoardWriteModal({categories,onClose,onSave}){
  var [title,setTitle]=useState("");
  var [content,setContent]=useState("");
  var [categoryId,setCategoryId]=useState((categories&&categories[0]&&categories[0].id)||"");

    <div className="modal-overlay" onClick={function(e){if(e.target===e.currentTarget)onClose();}}>

            <div style={{display:"flex",flexWrap:"wrap",gap:6}}>

                <button key={c.id} type="button" onClick={function(){setCategoryId(c.id);}}
                  style={{padding:"5px 13px",borderRadius:999,fontSize:11,fontWeight:600,cursor:"pointer",
                    border:"1.5px solid "+(categoryId===c.id?"#2563EB":"#E2E8F0"),
                    background:categoryId===c.id?"#EFF6FF":"#fff",
                    color:categoryId===c.id?"#2563EB":"#94A3B8"}}>
                  {c.name}
                </button>
              );})}
            </div>
          </div>
        )}

          <label style={{display:"block",fontSize:12,fontWeight:500,marginBottom:4}}>제목 *</label>
          <input value={title} onChange={function(e){setTitle(e.target.value);setErr("");}}
            className="ml-inp" autoFocus style={{width:"100%",padding:"8px 12px",border:"1px solid "+(err?"#EF4444":"#CBD5E1"),borderRadius:6,fontSize:12,outline:"none"}} placeholder="제목을 입력하세요"/>
        </div>

// ── BoardPostModal (글 상세 + 댓글) ──
function BoardPostModal({post,comments,categories,currentUser,onClose,onDeletePost,onAddComment,onDeleteComment,onEditPost}){

  var [posting,setPosting]=useState(false);
  var [editing,setEditing]=useState(false);
  var [editTitle,setEditTitle]=useState(post.title);
  var [editContent,setEditContent]=useState(post.content);
  var [editCategoryId,setEditCategoryId]=useState(post.categoryId||"");
  var [editErr,setEditErr]=useState("");
  var [savingEdit,setSavingEdit]=useState(false);

  var postComments=useMemo(function(){
    return comments.filter(function(c){return c.postId===post.id;}).sort(function(a,b){return(a.createdAt||"")>(b.createdAt||"")?1:-1;});
  },[comments,post.id]);

  function submitComment(e){
    e.preventDefault();
    if(!commentText.trim())return;
    setPosting(true);
    onAddComment({id:uid(),postId:post.id,content:commentText.trim()}).then(function(){setCommentText("");setPosting(false);}).catch(function(){setPosting(false);});
  }

  function submitEdit(e){
    e.preventDefault();
    if(!editTitle.trim()){setEditErr("제목을 입력해주세요.");return;}
    if(!editContent.trim()){setEditErr("내용을 입력해주세요.");return;}
    setSavingEdit(true);
    onEditPost({id:post.id,title:editTitle.trim(),content:editContent.trim(),categoryId:editCategoryId||null}).then(function(){setSavingEdit(false);setEditing(false);}).catch(function(){setSavingEdit(false);});
  }

  var canEditPost=currentUser.isAdmin||post.authorId===currentUser.id;
  var postCategory=(categories||[]).find(function(x){return x.id===post.categoryId;});

            <div style={{marginBottom:14}}>
              <label style={{display:"block",fontSize:12,fontWeight:500,marginBottom:6}}>분류</label>
              <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                {categories.map(function(c){return(
                  <button key={c.id} type="button" onClick={function(){setEditCategoryId(c.id);}}
                    style={{padding:"5px 13px",borderRadius:999,fontSize:11,fontWeight:600,cursor:"pointer",
                      border:"1.5px solid "+(editCategoryId===c.id?"#2563EB":"#E2E8F0"),
                      background:editCategoryId===c.id?"#EFF6FF":"#fff",
                      color:editCategoryId===c.id?"#2563EB":"#94A3B8"}}>
                    {c.name}
                  </button>
                );})}
              </div>
            </div>
          )}
          <div style={{marginBottom:14}}>
            <label style={{display:"block",fontSize:12,fontWeight:500,marginBottom:4}}>제목 *</label>

              className="ml-inp" style={{width:"100%",padding:"8px 12px",border:"1px solid "+(editErr?"#EF4444":"#CBD5E1"),borderRadius:6,fontSize:12,outline:"none"}}/>
          </div>
          <div style={{marginBottom:20}}>
            <label style={{display:"block",fontSize:12,fontWeight:500,marginBottom:4}}>내용 *</label>
            <textarea value={editContent} onChange={function(e){setEditContent(e.target.value);setEditErr("");}}
              className="ml-inp" style={{width:"100%",padding:"8px 12px",border:"1px solid #CBD5E1",borderRadius:6,fontSize:12,outline:"none",resize:"vertical",minHeight:160}}/>
            {editErr&&<p style={{fontSize:11,color:"#EF4444",marginTop:3}}>{editErr}</p>}
          </div>
          <div style={{display:"flex",justifyContent:"flex-end",gap:8}}>
            <button type="button" onClick={function(){setEditing(false);}} style={{padding:"8px 16px",border:"1px solid #CBD5E1",borderRadius:6,fontSize:12,color:"#64748B",background:"#fff",cursor:"pointer"}}>취소</button>
            <button type="submit" disabled={savingEdit} style={{padding:"8px 18px",background:"#2563EB",color:"#fff",borderRadius:6,fontSize:12,border:"none",cursor:"pointer",opacity:savingEdit?0.6:1}}>
              {savingEdit?"저장 중…":"저장"}
            </button>
          </div>
        </form>
      </div>
    );
  }

  return(
    <div className="modal-overlay" onClick={function(e){if(e.target===e.currentTarget)onClose();}}>

        <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:6}}>
          <div style={{flex:1,paddingRight:12}}>
            {postCategory&&<span className="tag" style={{background:"#F1F5F9",color:"#475569",marginBottom:6,display:"inline-block"}}>{postCategory.name}</span>}

          <button type="button" onClick={onClose} style={{background:"none",border:"none",cursor:"pointer",flexShrink:0}}><X size={18}/></button>

        </div>
        <div style={{background:"#F8FAFC",borderRadius:8,padding:"14px 16px",marginBottom:20,fontSize:12,color:"#374151",whiteSpace:"pre-wrap",lineHeight:1.6,border:"1px solid #E2E8F0"}}>

            <button type="submit" disabled={posting||!commentText.trim()}
              style={{padding:"8px 16px",background:"#2563EB",color:"#fff",borderRadius:6,fontSize:12,border:"none",cursor:"pointer",fontWeight:600,opacity:(posting||!commentText.trim())?0.5:1,whiteSpace:"nowrap"}}>

// ── BoardCategoryManageModal (관리자 전용) ──
function BoardCategoryManageModal({categories,title,onClose,onAdd,onRename,onDelete,onReorder}){
  var [newName,setNewName]=useState("");
  var [editingId,setEditingId]=useState(null);
  var [editingName,setEditingName]=useState("");
  var [saving,setSaving]=useState(false);

  function submitAdd(e){
    e.preventDefault();
    if(!newName.trim())return;
    setSaving(true);
    onAdd(newName.trim()).then(function(){setNewName("");setSaving(false);}).catch(function(){setSaving(false);});
  }
  function startEdit(c){setEditingId(c.id);setEditingName(c.name);}
  function submitRename(c){
    if(!editingName.trim()){setEditingId(null);return;}
    onRename(c.id,editingName.trim()).then(function(){setEditingId(null);});
  }
  function moveUp(idx){if(idx<=0||!onReorder)return;onReorder(idx,idx-1);}
  function moveDown(idx){if(idx>=categories.length-1||!onReorder)return;onReorder(idx,idx+1);}

  return(
    <div className="modal-overlay" onClick={function(e){if(e.target===e.currentTarget)onClose();}}>
      <div className="modal-box fade-in" style={{padding:24,color:"#1E293B"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:20}}>
          <h2 style={{fontSize:16,fontWeight:700}}>{title||"분류 관리"}</h2>
          <button type="button" onClick={onClose} style={{background:"none",border:"none",cursor:"pointer"}}><X size={18}/></button>
        </div>
        <div style={{marginBottom:20}}>
          {categories.length===0&&<p style={{fontSize:11,color:"#94A3B8",marginBottom:10}}>등록된 분류가 없어요.</p>}
          {categories.map(function(c,idx){return(
            <div key={c.id} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 0",borderBottom:"1px solid #F1F5F9"}}>
              {editingId===c.id?(
                <>
                  <input value={editingName} onChange={function(e){setEditingName(e.target.value);}}
                    autoFocus style={{flex:1,padding:"5px 10px",border:"1px solid #CBD5E1",borderRadius:5,fontSize:12,outline:"none"}}/>
                  <button onClick={function(){submitRename(c);}} style={{padding:"4px 10px",background:"#2563EB",color:"#fff",border:"none",borderRadius:5,fontSize:10,fontWeight:600,cursor:"pointer"}}>저장</button>
                  <button onClick={function(){setEditingId(null);}} style={{padding:"4px 10px",background:"#F1F5F9",color:"#64748B",border:"none",borderRadius:5,fontSize:10,cursor:"pointer"}}>취소</button>
                </>
              ):(
                <>
                  {onReorder&&(
                    <div style={{display:"flex",flexDirection:"column",gap:1}}>
                      <button onClick={function(){moveUp(idx);}} disabled={idx===0}
                        style={{padding:"0 4px",background:"none",border:"none",cursor:idx===0?"default":"pointer",color:idx===0?"#E2E8F0":"#94A3B8",lineHeight:1}}>
                        <CU size={12}/>
                      </button>
                      <button onClick={function(){moveDown(idx);}} disabled={idx===categories.length-1}
                        style={{padding:"0 4px",background:"none",border:"none",cursor:idx===categories.length-1?"default":"pointer",color:idx===categories.length-1?"#E2E8F0":"#94A3B8",lineHeight:1}}>
                        <CD size={12}/>
                      </button>
                    </div>
                  )}
                  <span style={{flex:1,fontSize:12,fontWeight:600}}>{c.name}</span>
                  <button onClick={function(){startEdit(c);}} style={{padding:"4px 10px",background:"#F8FAFC",color:"#374151",border:"1px solid #E2E8F0",borderRadius:5,fontSize:10,cursor:"pointer"}}>수정</button>
                  <button onClick={function(){if(window.confirm("\""+c.name+"\" 분류를 삭제할까요? 해당 분류의 글은 분류 없음으로 남습니다."))onDelete(c.id);}}
                    style={{padding:"4px 10px",background:"#FEF2F2",color:"#DC2626",border:"1px solid #FECACA",borderRadius:5,fontSize:10,cursor:"pointer"}}>삭제</button>
                </>
              )}
            </div>
          );})}
        </div>
        <form onSubmit={submitAdd} style={{display:"flex",gap:8}}>
          <input value={newName} onChange={function(e){setNewName(e.target.value);}}
            style={{flex:1,padding:"8px 12px",border:"1px solid #CBD5E1",borderRadius:6,fontSize:12,outline:"none"}} placeholder="새 분류 이름"/>
          <button type="submit" disabled={saving||!newName.trim()}
            style={{padding:"8px 16px",background:"#2563EB",color:"#fff",borderRadius:6,fontSize:12,border:"none",cursor:"pointer",fontWeight:600,opacity:(saving||!newName.trim())?0.5:1}}>
            추가
          </button>
        </form>
      </div>
    </div>
  );
}

// ── BoardView ──
function BoardView({posts,comments,categories,currentUser,onWrite,onItemClick,onManageCategories}){
  var [filterCat,setFilterCat]=useState("all");

  function categoryName(id){var c=categories.find(function(x){return x.id===id;});return c?c.name:null;}

  var sorted=useMemo(function(){
    var l=[...posts];
    if(filterCat!=="all")l=l.filter(function(p){return p.categoryId===filterCat;});
    return l.sort(function(a,b){return(b.createdAt||"")>(a.createdAt||"")?1:-1;});
  },[posts,filterCat]);

  function commentCount(postId){return comments.filter(function(c){return c.postId===postId;}).length;}

  return(
    <div style={{display:"flex",flexDirection:"column",flex:1,overflow:"hidden"}}>
      <div style={{background:"#F8FAFC",borderBottom:"1px solid #E2E8F0",padding:"10px 16px",display:"flex",flexWrap:"wrap",alignItems:"center",gap:8,flexShrink:0}}>
        {categories.length>0&&(
          <select value={filterCat} onChange={function(e){setFilterCat(e.target.value);}}
            style={{padding:"6px 10px",border:"1px solid #CBD5E1",borderRadius:6,fontSize:11,outline:"none",background:"#fff",color:"#1E293B"}}>
            <option value="all">전체 분류</option>
            {categories.map(function(c){return <option key={c.id} value={c.id}>{c.name}</option>;})}
          </select>
        )}
        <span className="ml-mono" style={{fontSize:10,color:"#94A3B8"}}>{sorted.length}개 글</span>
        <div style={{marginLeft:"auto",display:"flex",gap:8}}>
          {currentUser.isAdmin&&(
            <button onClick={onManageCategories} style={{display:"inline-flex",alignItems:"center",gap:5,padding:"6px 14px",background:"#F8FAFC",color:"#374151",borderRadius:6,fontSize:11,fontWeight:600,border:"1px solid #E2E8F0",cursor:"pointer"}}>분류 관리</button>
          )}
          <button onClick={onWrite} style={{display:"inline-flex",alignItems:"center",gap:5,padding:"6px 14px",background:"#2563EB",color:"#fff",borderRadius:6,fontSize:11,fontWeight:600,border:"none",cursor:"pointer"}}><Plus size={12}/> 글쓰기</button>
        </div>
      </div>
      <div className="tbl-wrap">
        {sorted.length===0?(
          <div style={{padding:40,textAlign:"center",fontSize:12,color:"#94A3B8"}}>{posts.length===0?"등록된 글이 없어요.":"해당 분류에 글이 없어요."}</div>
        ):(
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
            <thead>
              <tr style={{background:"#334155",color:"#E2E8F0"}}>
                <th style={{padding:"10px 14px",textAlign:"center",fontWeight:600,whiteSpace:"nowrap"}}>분류</th>
                <th style={{padding:"10px 16px",textAlign:"left",fontWeight:600}}>제목</th>
                <th style={{padding:"10px 14px",textAlign:"center",fontWeight:600,whiteSpace:"nowrap"}}>작성자</th>
                <th style={{padding:"10px 14px",textAlign:"center",fontWeight:600,whiteSpace:"nowrap"}}>댓글</th>
                <th style={{padding:"10px 14px",textAlign:"right",fontWeight:600,whiteSpace:"nowrap"}}>작성일</th>
              </tr>
            </thead>
            <tbody>
              {sorted.map(function(p,i){var catName=categoryName(p.categoryId);return(
                <tr key={p.id} className={"ml-row "+(i%2===0?"even":"odd")} onClick={function(){onItemClick(p);}} style={{cursor:"pointer"}}>
                  <td style={{padding:"11px 14px",textAlign:"center"}}>
                    {catName?<span className="tag" style={{background:"#F1F5F9",color:"#475569"}}>{catName}</span>:<span style={{fontSize:11,color:"#CBD5E1"}}>—</span>}
                  </td>
                  <td style={{padding:"11px 16px",fontWeight:600,color:"#1E293B",maxWidth:320,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.title}</td>
                  <td style={{padding:"11px 14px",textAlign:"center"}}>
                    <span style={{display:"inline-flex",alignItems:"center",gap:5}}>
                      <span style={{width:7,height:7,borderRadius:"50%",background:staffColor(p.authorId),display:"inline-block"}}/>
                      <span style={{fontSize:11,fontWeight:600,color:"#1E293B"}}>{staffName(p.authorId)}</span>
                    </span>
                  </td>
                  <td style={{padding:"11px 14px",textAlign:"center"}}>
                    <span className="ml-mono" style={{fontSize:11,color:"#64748B"}}>{commentCount(p.id)}</span>
                  </td>
                  <td className="ml-mono" style={{padding:"11px 16px",textAlign:"right",fontSize:10,color:"#94A3B8",whiteSpace:"nowrap"}}>{p.createdAt?p.createdAt.slice(0,10):"—"}</td>
                </tr>
              );})}
            </tbody>
          </table>
        )}
      </div>
    </div>
  );
}

            return(
              <div key={si.id} style={{padding:"10px 12px",marginBottom:8,background:"#F8FAFC",borderRadius:8,border:"1px solid #E2E8F0"}}>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
                  <span className="tag" style={{background:cfg.bg,color:cfg.color,flexShrink:0}}>{si.status}</span>
                  <span style={{fontSize:12,fontWeight:600,color:"#1E293B",flex:1}}>{si.title}</span>
                </div>
                <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                  {assignees.length===0?(
                    <span style={{fontSize:10,color:"#CBD5E1"}}>참여자 없음</span>
                  ):assignees.map(function(a){return(
                    <span key={a.id} style={{display:"inline-flex",alignItems:"center",gap:4,padding:"2px 8px",borderRadius:999,background:staffColor(a.staffId)+"22",border:"1px solid "+staffColor(a.staffId)+"44"}}>
                      <span style={{width:6,height:6,borderRadius:"50%",background:staffColor(a.staffId),display:"inline-block"}}/>
                      <span style={{fontSize:10,fontWeight:600,color:"#1E293B"}}>{staffName(a.staffId)}</span>
                    </span>
                  );})}
                  <div style={{marginLeft:"auto",display:"flex",gap:6}}>
                    {!todo.closed&&si.status!=="완료"&&(
                      isMine?(
                        <button onClick={function(){onLeaveSub(si,myA);}}
                          style={{padding:"3px 10px",background:"#FEF2F2",color:"#DC2626",border:"1px solid #FECACA",borderRadius:999,fontSize:10,fontWeight:600,cursor:"pointer"}}>
                          참여취소
                        </button>
                      ):(
                        <button onClick={function(){onJoinSub(si);}}
                          style={{padding:"3px 10px",background:"#EFF6FF",color:"#2563EB",border:"1px solid #BFDBFE",borderRadius:999,fontSize:10,fontWeight:600,cursor:"pointer"}}>
                          참여
                        </button>
                      )
                    )}
                    {!todo.closed&&(
                      si.status==="완료"?(
                        <button onClick={function(){onReopenSub(si);}}
                          style={{padding:"3px 10px",background:"#FEF3C7",color:"#92400E",border:"1px solid #FDE68A",borderRadius:999,fontSize:10,fontWeight:600,cursor:"pointer"}}>
                          취소
                        </button>
                      ):(
                        <button onClick={function(){onCompleteSub(si);}}
                          style={{padding:"3px 10px",background:"#059669",color:"#fff",border:"none",borderRadius:999,fontSize:10,fontWeight:600,cursor:"pointer"}}>
                          완료
                        </button>
                      )
                    )}
                  </div>
                </div>
                {si.completedBy&&si.status==="완료"&&(
                  <div style={{fontSize:9,color:"#94A3B8",marginTop:6}}>완료: {staffName(si.completedBy)} · {si.completedAt?fmtDateTime(si.completedAt):""}</div>
                )}
              </div>
            );
          })}
        </div>

        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          {todo.closed?<span/>:(
            <button type="button" onClick={function(){onEdit(todo);}}
              style={{display:"inline-flex",alignItems:"center",gap:6,padding:"8px 14px",border:"1px solid #E2E8F0",borderRadius:6,fontSize:12,color:"#374151",background:"#F8FAFC",cursor:"pointer"}}>
              <Pencil size={13}/> 수정
            </button>
          )}
          <div style={{display:"flex",gap:8}}>
            <button type="button" onClick={onClose} style={{padding:"8px 16px",border:"1px solid #CBD5E1",borderRadius:6,fontSize:12,color:"#64748B",background:"#fff",cursor:"pointer"}}>닫기</button>
            {allDone&&!todo.closed&&(
              <button type="button" onClick={function(){onCloseTodo(todo);}} style={{padding:"8px 18px",background:"#059669",color:"#fff",borderRadius:6,fontSize:12,border:"none",cursor:"pointer",fontWeight:600}}>종료</button>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}
// ── TodoView ──
function TodoView({todos,subitemsByTodo,allAssigneesByTodo,todoCategories,currentUser,onAdd,onItemClick,onManageCategories,onCloseTodo}){
  var [mainFilter,setMainFilter]=useState("active"); // active | closed
  var [filterStore,setFilterStore]=useState("all");
  var [filterCat,setFilterCat]=useState("all");
  function catName(id){var c=(todoCategories||[]).find(function(x){return x.id===id;});return c?c.name:null;}

  var filtered=useMemo(function(){
    var l=[...todos].sort(function(a,b){return b.createdAt>a.createdAt?1:-1;});
    l=l.filter(function(t){return mainFilter==="closed"?!!t.closed:!t.closed;});
    if(filterStore!=="all")l=l.filter(function(t){return t.storeId===filterStore;});
    if(filterCat!=="all")l=l.filter(function(t){return(t.categoryId||"")===(filterCat==="none"?"":filterCat);});
    return l;
  },[todos,mainFilter,filterStore,filterCat]);

  return(
    <div style={{display:"flex",flexDirection:"column",flex:1,overflow:"hidden"}}>
      <div style={{background:"#F1F5F9",borderBottom:"1px solid #E2E8F0",padding:"8px 16px",display:"flex",gap:6,flexShrink:0}}>
        <button onClick={function(){setMainFilter("active");}}
          style={{padding:"6px 14px",borderRadius:6,fontSize:11,fontWeight:600,border:"none",cursor:"pointer",background:mainFilter==="active"?"#1E293B":"transparent",color:mainFilter==="active"?"#F8FAFC":"#64748B"}}>
          진행중
        </button>
        <button onClick={function(){setMainFilter("closed");}}
          style={{padding:"6px 14px",borderRadius:6,fontSize:11,fontWeight:600,border:"none",cursor:"pointer",background:mainFilter==="closed"?"#1E293B":"transparent",color:mainFilter==="closed"?"#F8FAFC":"#64748B"}}>
          완료
        </button>
      </div>
      <div style={{background:"#F8FAFC",borderBottom:"1px solid #E2E8F0",padding:"10px 16px",display:"flex",flexWrap:"wrap",alignItems:"center",gap:8,flexShrink:0}}>
        <select value={filterStore} onChange={function(e){setFilterStore(e.target.value);}} style={{padding:"6px 10px",border:"1px solid #CBD5E1",borderRadius:6,fontSize:11,outline:"none",background:"#fff",color:"#1E293B"}}>
          <option value="all">전체 매장</option>
          {TODO_STORES.map(function(s){return <option key={s.id} value={s.id}>{s.label}</option>;})}
        </select>
        {todoCategories&&todoCategories.length>0&&(
          <select value={filterCat} onChange={function(e){setFilterCat(e.target.value);}} style={{padding:"6px 10px",border:"1px solid #CBD5E1",borderRadius:6,fontSize:11,outline:"none",background:"#fff",color:"#1E293B"}}>
            <option value="all">전체 분류</option>
            <option value="none">분류 없음</option>
            {todoCategories.map(function(c){return <option key={c.id} value={c.id}>{c.name}</option>;})}
          </select>
        )}
        <span className="ml-mono" style={{fontSize:10,color:"#94A3B8"}}>{filtered.length}건</span>
        <div style={{marginLeft:"auto",display:"flex",gap:8}}>
          {currentUser&&currentUser.isAdmin&&(
            <button onClick={onManageCategories} style={{padding:"5px 10px",background:"#F8FAFC",color:"#374151",borderRadius:6,fontSize:10,fontWeight:600,border:"1px solid #E2E8F0",cursor:"pointer"}}>분류 관리</button>
          )}
          <button onClick={onAdd} style={{display:"inline-flex",alignItems:"center",gap:5,padding:"6px 14px",background:"#2563EB",color:"#fff",borderRadius:6,fontSize:11,fontWeight:600,border:"none",cursor:"pointer"}}><Plus size={12}/> 할 일 추가</button>
        </div>
      </div>
      <div className="tbl-wrap">
        {filtered.length===0?<div style={{padding:40,textAlign:"center",fontSize:12,color:"#94A3B8"}}>{mainFilter==="closed"?"완료된 할 일이 없어요.":"할 일을 추가해주세요."}</div>:(
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
            <thead>
              <tr style={{background:"#334155",color:"#E2E8F0"}}>
                <th style={{padding:"10px 16px",textAlign:"left",fontWeight:600}}>할 일</th>
                <th style={{padding:"10px 14px",textAlign:"center",fontWeight:600,whiteSpace:"nowrap"}}>진행상태</th>
                <th style={{padding:"10px 14px",textAlign:"center",fontWeight:600,whiteSpace:"nowrap"}}>매장</th>
                <th style={{padding:"10px 14px",textAlign:"left",fontWeight:600,whiteSpace:"nowrap"}}>참여자</th>
                <th style={{padding:"10px 14px",textAlign:"right",fontWeight:600,whiteSpace:"nowrap"}}>요청자/시간</th>
                <th style={{padding:"10px 10px"}}/>
              </tr>
            </thead>
            <tbody>
              {filtered.map(function(t,i){
                var b=todoBadge(t.storeId);
                var cn=catName(t.categoryId);
                var subitems=subitemsByTodo[t.id]||[];
                var doneCount=subitems.filter(function(s){return s.status==="완료";}).length;
                var totalCount=subitems.length;
                var allDone=totalCount>0&&doneCount===totalCount;
                var assignees=allAssigneesByTodo[t.id]||[];
                return(
                  <tr key={t.id} className={"ml-row "+(i%2===0?"even":"odd")} onClick={function(){onItemClick(t);}} style={{cursor:"pointer"}}>
                    <td style={{padding:"11px 16px"}}>
                      <div style={{fontWeight:600,color:"#1E293B",marginBottom:(t.detail||cn)?3:0}}>{t.title}</div>
                      <div style={{display:"flex",gap:5,alignItems:"center",flexWrap:"wrap"}}>
                        {cn&&<span className="tag" style={{background:"#F1F5F9",color:"#475569",fontSize:9}}>{cn}</span>}
                        {t.detail&&<span style={{fontSize:10,color:"#94A3B8",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:260}}>{t.detail}</span>}
                      </div>
                    </td>
                    <td style={{padding:"11px 14px",textAlign:"center"}}>
                      <span className="tag" style={{background:allDone?"#DCFCE7":"#DBEAFE",color:allDone?"#14532D":"#1E40AF"}}>{doneCount}/{totalCount} 완료</span>
                    </td>
                    <td style={{padding:"11px 14px",textAlign:"center"}}><span className="tag" style={{background:b.bg,color:b.color}}>{t.storeId||"—"}</span></td>
                    <td style={{padding:"11px 14px"}}>
                      {assignees.length===0?<span style={{fontSize:11,color:"#94A3B8"}}>미정</span>:(
                        <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
                          {assignees.map(function(a){return(
                            <span key={a} style={{display:"inline-flex",alignItems:"center",gap:4}}>
                              <span style={{width:7,height:7,borderRadius:"50%",background:staffColor(a),display:"inline-block"}}/>
                              <span style={{fontSize:11,fontWeight:600,color:"#1E293B"}}>{staffName(a)}</span>
                            </span>
                          );})}
                        </div>
                      )}
                    </td>
                    <td style={{padding:"11px 16px",textAlign:"right"}}>
                      <div style={{fontSize:11,fontWeight:600,color:"#374151"}}>{staffName(t.staffId)}</div>
                      <div className="ml-mono" style={{fontSize:9,color:"#94A3B8"}}>{t.createdAt?fmtDateTime(t.createdAt):"—"}</div>
                    </td>
                    <td style={{padding:"11px 10px",textAlign:"center"}}>
                      {allDone&&!t.closed&&(
                        <button onClick={function(e){e.stopPropagation();onCloseTodo(t);}}
                          style={{padding:"4px 10px",background:"#059669",color:"#fff",border:"none",borderRadius:999,fontSize:10,fontWeight:600,cursor:"pointer",whiteSpace:"nowrap"}}>
                          종료
                        </button>
                      )}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        )}
      </div>
    </div>
  );
}

// ── StaffManageModal ──
function StaffManageModal({staffList,onStaffChange,onClose}){
  var [pins,setPins]=useState({}); // staffId -> {pin, isAdmin}
  var [loading,setLoading]=useState(true);
  var [saving,setSaving]=useState(false);
  var [newName,setNewName]=useState("");
  var [newPin,setNewPin]=useState("");
  var [newIsAdmin,setNewIsAdmin]=useState(false);
  var [newColor,setNewColor]=useState(STAFF_COLORS[0]);
  var [err,setErr]=useState("");

  useEffect(function(){
    (async function(){
      try{
        var r=await sb.from("staff_pins").select("staff_id,pin,is_admin");
        var map={};
        (r.data||[]).forEach(function(x){map[x.staff_id]={pin:x.pin,isAdmin:!!x.is_admin};});
        setPins(map);
      }catch(e){}
      setLoading(false);
    })();
  },[]);

  async function savePin(staffId,newPin,isAdmin){
    setSaving(true);
    try{
      await sb.from("staff_pins").update({pin:newPin,is_admin:isAdmin}).eq("staff_id",staffId);
      setPins(function(prev){return{...prev,[staffId]:{pin:newPin,isAdmin:isAdmin}};});
      // 관리자 권한 변경을 staffList에도 반영
      onStaffChange(staffList.map(function(s){return s.id===staffId?{...s,isAdmin:isAdmin}:s;}));
    }catch(e){alert("저장 실패: "+e.message);}
    setSaving(false);
  }

  async function addStaff(e){
    e.preventDefault();
    if(!newName.trim()){setErr("이름을 입력해주세요.");return;}
    if(!newPin.trim()){setErr("PIN을 입력해주세요.");return;}
    var newId="staff_"+Date.now();
    setSaving(true);
    try{
      await sb.from("staff_pins").insert({staff_id:newId,name:newName.trim(),color:newColor,pin:newPin.trim(),is_admin:newIsAdmin});
      var newStaff={id:newId,name:newName.trim(),color:newColor,isAdmin:newIsAdmin};
      STAFF.push(newStaff);
      var updated=[...staffList,newStaff];
      onStaffChange(updated);
      setPins(function(prev){return{...prev,[newId]:{pin:newPin.trim(),isAdmin:newIsAdmin}};});
      setNewName("");setNewPin("");setNewIsAdmin(false);setNewColor(STAFF_COLORS[updated.length%STAFF_COLORS.length]);setErr("");
    }catch(e){alert("추가 실패: "+e.message);}
    setSaving(false);
  }

  return(
    <div className="modal-overlay" onClick={function(e){if(e.target===e.currentTarget)onClose();}}>
      <div className="modal-box fade-in" style={{padding:24,color:"#1E293B",maxWidth:520}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:20}}>
          <h2 style={{fontSize:16,fontWeight:700}}>직원 관리</h2>
          <button type="button" onClick={onClose} style={{background:"none",border:"none",cursor:"pointer"}}><X size={18}/></button>
        </div>

        {loading?<div style={{textAlign:"center",padding:20,color:"#94A3B8"}}>불러오는 중…</div>:(
          <>
            <div style={{marginBottom:24}}>
              <div style={{fontSize:11,fontWeight:700,color:"#64748B",marginBottom:10}}>등록된 직원</div>
              {staffList.map(function(s){
                var info=pins[s.id]||{pin:"",isAdmin:false};
                return <StaffRow key={s.id} staff={s} info={info} onSave={savePin} saving={saving}/>;
              })}
              {staffList.length===0&&<p style={{fontSize:11,color:"#94A3B8"}}>직원이 없어요.</p>}
            </div>

            <div style={{background:"#F8FAFC",borderRadius:10,padding:"16px",border:"1px solid #E2E8F0"}}>
              <div style={{fontSize:11,fontWeight:700,color:"#64748B",marginBottom:12}}>신규 직원 추가</div>
              <form onSubmit={addStaff}>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
                  <div>
                    <label style={{display:"block",fontSize:11,fontWeight:500,marginBottom:4}}>이름</label>
                    <input value={newName} onChange={function(e){setNewName(e.target.value);setErr("");}}
                      className="ml-inp" style={{width:"100%",padding:"7px 10px",border:"1px solid #CBD5E1",borderRadius:6,fontSize:12,outline:"none"}} placeholder="홍길동"/>
                  </div>
                  <div>
                    <label style={{display:"block",fontSize:11,fontWeight:500,marginBottom:4}}>PIN</label>
                    <input value={newPin} onChange={function(e){setNewPin(e.target.value);setErr("");}}
                      className="ml-inp" style={{width:"100%",padding:"7px 10px",border:"1px solid #CBD5E1",borderRadius:6,fontSize:12,outline:"none"}} placeholder="1234"/>
                  </div>
                </div>
                <div style={{marginBottom:10}}>
                  <label style={{display:"block",fontSize:11,fontWeight:500,marginBottom:6}}>색상</label>
                  <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                    {STAFF_COLORS.map(function(c){return(
                      <button key={c} type="button" onClick={function(){setNewColor(c);}}
                        style={{width:28,height:28,borderRadius:"50%",background:c,border:newColor===c?"3px solid #1E293B":"2px solid transparent",cursor:"pointer"}}>
                      </button>
                    );})}
                  </div>
                </div>
                <label style={{display:"flex",alignItems:"center",gap:8,fontSize:12,cursor:"pointer",marginBottom:10}}>
                  <input type="checkbox" checked={newIsAdmin} onChange={function(e){setNewIsAdmin(e.target.checked);}} style={{accentColor:"#2563EB"}}/>
                  관리자 권한 부여
                </label>
                {err&&<p style={{fontSize:11,color:"#EF4444",marginBottom:8}}>{err}</p>}
                <button type="submit" disabled={saving}
                  style={{width:"100%",padding:"8px",background:"#2563EB",color:"#fff",border:"none",borderRadius:6,fontSize:12,fontWeight:600,cursor:"pointer",opacity:saving?0.6:1}}>
                  {saving?"추가 중…":"직원 추가"}
                </button>
              </form>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

function StaffRow({staff,info,onSave,saving}){
  var [pin,setPin]=useState(info.pin||"");
  var [isAdmin,setIsAdmin]=useState(!!info.isAdmin);
  var [editing,setEditing]=useState(false);

  function save(){
    if(!pin.trim()){alert("PIN을 입력해주세요.");return;}
    onSave(staff.id,pin.trim(),isAdmin).then(function(){setEditing(false);}).catch(function(){});
  }
  return(
    <div style={{display:"flex",alignItems:"center",gap:10,padding:"10px 0",borderBottom:"1px solid #F1F5F9"}}>
      <span style={{width:10,height:10,borderRadius:"50%",background:staff.color,display:"inline-block",flexShrink:0}}/>
      <span style={{fontWeight:600,fontSize:12,flex:1}}>{staff.name}</span>
      {editing?(
        <>
          <input value={pin} onChange={function(e){setPin(e.target.value);}}
            style={{width:80,padding:"4px 8px",border:"1px solid #CBD5E1",borderRadius:5,fontSize:11,outline:"none"}} placeholder="PIN"/>
          <label style={{display:"flex",alignItems:"center",gap:4,fontSize:10,cursor:"pointer",whiteSpace:"nowrap"}}>
            <input type="checkbox" checked={isAdmin} onChange={function(e){setIsAdmin(e.target.checked);}} style={{accentColor:"#2563EB"}}/>
            관리자
          </label>
          <button onClick={save} disabled={saving}
            style={{padding:"4px 10px",background:"#2563EB",color:"#fff",border:"none",borderRadius:5,fontSize:10,fontWeight:600,cursor:"pointer"}}>저장</button>
          <button onClick={function(){setPin(info.pin||"");setIsAdmin(!!info.isAdmin);setEditing(false);}}
            style={{padding:"4px 10px",background:"#F1F5F9",color:"#64748B",border:"none",borderRadius:5,fontSize:10,cursor:"pointer"}}>취소</button>
        </>
      ):(
        <>
          <span className="ml-mono" style={{fontSize:10,color:"#94A3B8"}}>PIN: {"•".repeat(Math.min(pin.length,6)||4)}</span>
          {isAdmin&&<span style={{fontSize:9,fontWeight:700,color:"#2563EB",background:"#DBEAFE",padding:"1px 6px",borderRadius:4,whiteSpace:"nowrap"}}>관리자</span>}
          <button onClick={function(){setEditing(true);}}
            style={{padding:"4px 10px",background:"#F8FAFC",color:"#374151",border:"1px solid #E2E8F0",borderRadius:5,fontSize:10,cursor:"pointer"}}>수정</button>
        </>
      )}
    </div>
  );
}

// ── LoginScreen ──
function LoginScreen({onLogin}){
  var [staffOptions,setStaffOptions]=useState([]);
  var [selectedStaff,setSelectedStaff]=useState(null);
  var [pin,setPin]=useState("");
  var [err,setErr]=useState("");
  var [loading,setLoading]=useState(false);
  var [loadingStaff,setLoadingStaff]=useState(true);

  useEffect(function(){
    (async function(){
      try{
        var r=await sb.from("staff_pins").select("staff_id,name,color,pin,is_admin").order("staff_id",{ascending:true});
        var list=(r.data||[]).filter(function(x){return x.name;}).map(function(x,i){
          return{id:x.staff_id,name:x.name,color:x.color||STAFF_COLORS[i%STAFF_COLORS.length],pin:x.pin,isAdmin:!!x.is_admin};
        });
        setStaffOptions(list);
        // 전역 STAFF도 채워두기
        STAFF.length=0;list.forEach(function(s){STAFF.push(s);});
      }catch(e){setErr("직원 정보를 불러오지 못했어요.");}
      setLoadingStaff(false);
    })();
  },[]);

  async function submit(e){
    e.preventDefault();
    if(!selectedStaff){setErr("직원을 선택해주세요.");return;}
    if(!pin.trim()){setErr("PIN을 입력해주세요.");return;}
    setLoading(true);setErr("");
    try{
      if(String(selectedStaff.pin)!==pin.trim()){setErr("PIN이 틀렸어요.");setLoading(false);setPin("");return;}
      onLogin({id:selectedStaff.id,name:selectedStaff.name,color:selectedStaff.color,isAdmin:!!selectedStaff.isAdmin});
    }catch(ex){setErr("오류: "+(ex&&ex.message?ex.message:String(ex)));setLoading(false);}
  }

  return(
    <div style={{minHeight:"100vh",background:"#F1F5F9",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24}}>
      <div style={{background:"#1E293B",borderRadius:16,padding:"28px 32px",width:"100%",maxWidth:380,boxShadow:"0 20px 50px rgba(0,0,0,.25)"}}>
        <div className="ml-mono" style={{fontSize:9,letterSpacing:".12em",textTransform:"uppercase",color:"#94A3B8",marginBottom:4}}>업무 관리</div>
        <h1 style={{fontSize:21,fontWeight:700,color:"#F8FAFC",marginBottom:24}}>미플+아카이브</h1>

        <form onSubmit={submit}>
          <div style={{marginBottom:16}}>
            <label style={{display:"block",fontSize:11,fontWeight:600,color:"#94A3B8",marginBottom:8}}>직원 선택</label>
            {loadingStaff?(
              <div style={{textAlign:"center",padding:12,color:"#64748B",fontSize:11}}>불러오는 중…</div>
            ):(

                    {s.name}

            {loading?"확인 중…":"로그인"}
          </button>
        </form>
      </div>
    </div>
  );
}

var STORAGE_KEY="miple_user_v1";

// ── Tab Error Boundary ──
class TabErrorBoundary extends React.Component{
  constructor(props){super(props);this.state={error:null};}
  static getDerivedStateFromError(e){return{error:e};}
  componentDidCatch(e,info){console.error("Tab error:",e,info);}
  render(){
    if(this.state.error){
      return React.createElement("div",{style:{padding:32,textAlign:"center",color:"#991B1B",background:"#FEF2F2",margin:16,borderRadius:12,border:"1px solid #FECACA"}},
        React.createElement("div",{style:{fontSize:15,fontWeight:700,marginBottom:8}},"이 탭에서 오류가 발생했어요"),
        React.createElement("div",{style:{fontSize:11,color:"#B91C1C",marginBottom:16,fontFamily:"monospace",whiteSpace:"pre-wrap"}},this.state.error&&this.state.error.message?this.state.error.message:String(this.state.error)),
        React.createElement("button",{
          onClick:function(){this.setState({error:null});}.bind(this),
          style:{padding:"8px 20px",background:"#DC2626",color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontSize:12,fontWeight:600}
        },"다시 시도")
      );
    }
    return this.props.children;
  }
}

  async function handleUpdateOrderStatus(orderId,newStatus,currentStatus){
    var now=new Date().toISOString();
    var isBackward=currentStatus&&STATUSES.findIndex(function(s){return s.id===newStatus;})<STATUSES.findIndex(function(s){return s.id===currentStatus;});
    var updates={status:newStatus,changed_at:now};
    if(newStatus==="주문"){updates.ordered_by=myId;updates.ordered_at=now;}
    if(newStatus==="수령"){updates.completed_by=myId;updates.completed_at=now;}
    if(isBackward){
      // 되돌아갈 때는 새 상태보다 이후 단계의 담당자/시각을 모두 비움
      var newIdx=STATUSES.findIndex(function(s){return s.id===newStatus;});
      var orderIdx=STATUSES.findIndex(function(s){return s.id==="주문";});
      var receiveIdx=STATUSES.findIndex(function(s){return s.id==="수령";});
      if(newIdx<orderIdx){updates.ordered_by=null;updates.ordered_at=null;}
      if(newIdx<receiveIdx){updates.completed_by=null;updates.completed_at=null;}
    }
    try{
      await sb.from("order_history").update(updates).eq("id",orderId);
      setOrders(function(prev){return prev.map(function(o){
        if(o.id!==orderId)return o;
        var next={...o,status:newStatus,changedAt:now};
        if(newStatus==="주문"){next.orderedBy=myId;next.orderedAt=now;}
        if(newStatus==="수령"){next.completedBy=myId;next.completedAt=now;}
        if(isBackward){
          var newIdx2=STATUSES.findIndex(function(s){return s.id===newStatus;});
          var orderIdx2=STATUSES.findIndex(function(s){return s.id==="주문";});
          var receiveIdx2=STATUSES.findIndex(function(s){return s.id==="수령";});
          if(newIdx2<orderIdx2){next.orderedBy=null;next.orderedAt=null;}
          if(newIdx2<receiveIdx2){next.completedBy=null;next.completedAt=null;}
        }
        return next;
      });});

  function handleSaveNormalHours(entries){
    // entries: [{id,staffId,dow,startTime,endTime,isHoliday}]
    var today=dateStr(new Date());
    var yesterday=(function(){var d=new Date();d.setDate(d.getDate()-1);return dateStr(d);})();
    var rows=entries.map(function(e){return{id:e.id,staff_id:e.staffId||null,dow:e.dow!=null?e.dow:null,start_time:e.startTime,end_time:e.endTime,is_holiday:!!e.isHoliday,valid_from:today,valid_to:null,updated_at:new Date().toISOString()};});
    // 현재 활성(valid_to가 null인) 규칙들을 어제 날짜로 종료 처리 후 새 규칙 삽입
    return sb.from("normal_hours").update({valid_to:yesterday}).is("valid_to",null).then(function(){
      var p=rows.length>0?sb.from("normal_hours").insert(rows):Promise.resolve();
      return p;
    }).then(function(){
      setNormalHours(function(prev){
        var closed=prev.map(function(h){return h.validTo===null?{...h,validTo:yesterday}:h;});
        var fresh=entries.map(function(e){return{id:e.id,staffId:e.staffId||null,dow:e.dow!=null?e.dow:null,startTime:e.startTime||"",endTime:e.endTime||"",isHoliday:!!e.isHoliday,validFrom:today,validTo:null};});
        return[...closed,...fresh];
      });
    });
  }

  function handleVoteEvent(eventId,response){
    var existing=eventVotes.find(function(v){return v.eventId===eventId&&v.staffId===myId;});
    if(existing&&existing.response===response){
      sb.from("event_votes").delete().eq("id",existing.id).then(function(){
        setEventVotes(function(prev){return prev.filter(function(v){return v.id!==existing.id;});});
      });
      return;
    }
    var newRow={id:uid(),event_id:eventId,staff_id:myId,response:response};
    sb.from("event_votes").upsert(newRow,{onConflict:"event_id,staff_id"}).then(function(){
      setEventVotes(function(prev){
        var filtered=prev.filter(function(v){return!(v.eventId===eventId&&v.staffId===myId);});
        return[...filtered,{id:newRow.id,eventId:newRow.event_id,staffId:newRow.staff_id,response:newRow.response}];
      });
    }).catch(function(e){alert("투표 실패: "+e.message);});
  }

              <TodoView todos={todos} subitemsByTodo={subitemsByTodo} allAssigneesByTodo={allAssigneesByTodo} todoCategories={todoCategories} currentUser={currentUser} onAdd={function(){setTodoModal({});}} onItemClick={function(t){setTodoDetailModal(t);}} onManageCategories={function(){setTodoCategoryManageModal(true);}} onCloseTodo={handleCloseTodo}/>
            </TabErrorBoundary>
          )}
        </>
      )}
      {dayDetailModal!==null&&(
        <DayDetailModal date={dayDetailModal} works={works} currentUser={currentUser}
          onClose={function(){setDayDetailModal(null);}}
          onEditWork={function(w){setDayDetailModal(null);setWorkModal({record:w});}}/>
      )}
      {workModal!==null&&<WorkModal record={workModal.record||null} defaultDate={workModal.date||null} forceStaffId={workModal.forceStaffId||null} defaultStaffId={workModal.defaultStaffId||myId} normalHours={normalHours} onClose={function(){setWorkModal(null);}} onSave={handleSaveWork} onDelete={handleDeleteWork}/>}
      {hoursModal&&<NormalHoursModal normalHours={normalHours} onClose={function(){setHoursModal(false);}} onSave={handleSaveNormalHours}/>}
      {eventModal!==null&&<EventModal event={eventModal.id?eventModal:null} votes={eventVotes} defaultDate={eventModal.date||null} currentUser={currentUser} onClose={function(){setEventModal(null);}} onSave={handleSaveEvent} onDelete={handleDeleteEvent} onVote={handleVoteEvent}/>}
      {itemModal!==null&&<ItemDetailModal item={itemModal} history={orders} orderCategories={orderCategories} onClose={function(){setItemModal(null);}} onSave={handleSaveItem} onDelete={handleDeleteItem}/>}
      {orderCategoryManageModal&&<BoardCategoryManageModal categories={[...orderCategories].sort(function(a,b){return a.sortOrder-b.sortOrder;})} title="상품 카테고리 관리" onClose={function(){setOrderCategoryManageModal(false);}} onAdd={handleAddOrderCategory} onRename={handleRenameOrderCategory} onDelete={handleDeleteOrderCategory} onReorder={handleReorderOrderCategory}/>}
      {todoModal!==null&&<TodoModal todo={todoModal} currentUser={currentUser} todoCategories={todoCategories} onClose={function(){setTodoModal(null);}} onSave={handleSaveTodo} onDelete={handleDeleteTodo}/>}
      {todoDetailModal!==null&&<TodoDetailModal todo={todoDetailModal} subitems={subitemsByTodo[todoDetailModal.id]||[]} assigneesBySubitem={assigneesBySubitem} todoCategories={todoCategories} currentUser={currentUser}
        onClose={function(){setTodoDetailModal(null);}}
        onEdit={function(t){setTodoDetailModal(null);setTodoModal(t);}}
        onJoinSub={handleJoinSubitem} onLeaveSub={handleLeaveSubitem} onCompleteSub={handleCompleteSubitem} onReopenSub={handleReopenSubitem} onCloseTodo={handleCloseTodo}/>}
      {todoCategoryManageModal&&<BoardCategoryManageModal categories={[...todoCategories].sort(function(a,b){return a.sortOrder-b.sortOrder;})} title="할 일 분류 관리" onClose={function(){setTodoCategoryManageModal(false);}} onAdd={handleAddTodoCategory} onRename={handleRenameTodoCategory} onDelete={handleDeleteTodoCategory} onReorder={handleReorderTodoCategory}/>}
      {subModal!==null&&<SubscriptionModal sub={subModal} storeId={subStoreTab} defaultMonth={subModal.defaultMonth} allSubs={subs.filter(function(s){return s.storeId===subStoreTab;})} onClose={function(){setSubModal(null);}} onSave={handleSaveSub} onDelete={handleDeleteSub}/>}
      {writingPost&&<BoardWriteModal categories={categories} onClose={function(){setWritingPost(false);}} onSave={handleWritePost}/>}
      {postModal!==null&&<BoardPostModal post={postModal} comments={comments} categories={categories} currentUser={currentUser} onClose={function(){setPostModal(null);}} onDeletePost={handleDeletePost} onEditPost={handleEditPost} onAddComment={handleAddComment} onDeleteComment={handleDeleteComment}/>}
      {categoryManageModal&&<BoardCategoryManageModal categories={categories} title="게시판 분류 관리" onClose={function(){setCategoryManageModal(false);}} onAdd={handleAddCategory} onRename={handleRenameCategory} onDelete={handleDeleteCategory}/>}
      {staffManageModal&&<StaffManageModal staffList={staffList} onStaffChange={function(updated){setStaffList(updated);STAFF.length=0;updated.forEach(function(s){STAFF.push(s);});}} onClose={function(){setStaffManageModal(false);}}/>}
    </div>
  );
}

root.render(<App/>);
