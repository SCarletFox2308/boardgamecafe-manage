const {useState,useEffect,useMemo,Fragment}=React;
const IB={fill:"none",stroke:"currentColor",strokeWidth:2,strokeLinecap:"round",strokeLinejoin:"round"};
const svg=(p,w,h,v,...c)=>React.createElement("svg",{width:w||16,height:h||16,viewBox:v||"0 0 24 24",...IB,...p},...c);
const path=(d)=>React.createElement("path",{d});
const circle=(cx,cy,r)=>React.createElement("circle",{cx,cy,r});
const rect=(x,y,w,h,rx)=>React.createElement("rect",{x,y,width:w,height:h,rx});
const line=(x1,y1,x2,y2)=>React.createElement("line",{x1,y1,x2,y2});
function Plus(p){return svg(p,16,16,"0 0 24 24",path("M5 12h14M12 5v14"));}
function Pencil(p){return svg(p,16,16,"0 0 24 24",path("M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"),path("m15 5 4 4"));}
function Trash2(p){return svg(p,16,16,"0 0 24 24",path("M3 6h18"),path("M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"),path("M10 11v6"),path("M14 11v6"));}
function X(p){return svg(p,16,16,"0 0 24 24",path("M18 6 6 18M6 6l12 12"));}
function CL(p){return svg(p,16,16,"0 0 24 24",path("m15 18-6-6 6-6"));}
function CR(p){return svg(p,16,16,"0 0 24 24",path("m9 18 6-6-6-6"));}
function CD(p){return svg(p,16,16,"0 0 24 24",path("m6 9 6 6 6-6"));}
function CU(p){return svg(p,16,16,"0 0 24 24",path("m18 15-6-6-6 6"));}
function ListIcon(p){return svg(p,16,16,"0 0 24 24",line(8,6,21,6),line(8,12,21,12),line(8,18,21,18),line(3,6,3.01,6),line(3,12,3.01,12),line(3,18,3.01,18));}
function CalIcon(p){return svg(p,16,16,"0 0 24 24",rect(3,4,18,18,2),line(16,2,16,6),line(8,2,8,6),line(3,10,21,10));}
function PkgIcon(p){return svg(p,16,16,"0 0 24 24",path("m7.5 4.27 9 5.15"),path("M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"),path("m3.3 7 8.7 5 8.7-5"),path("M12 22V12"));}

// ── 설정 ──
// 매장 추가/삭제는 이 STORES 배열 하나만 수정하면 전체 사이트에 반영됩니다.
const STORES=[
  {id:"미플",    label:"미플보드게임",      badge:{bg:"#FEF3C7",color:"#92400E"}},
  {id:"아카이브", label:"보드게임 아카이브", badge:{bg:"#DBEAFE",color:"#1E40AF"}},
];
// 할 일 목록 전용 담당 매장 = STORES + "본사"
const TODO_STORES=[
  ...STORES,
  {id:"본사", label:"본사", badge:{bg:"#F3E8FF",color:"#6B21A8"}},
];
const STAFF_COLORS=["#7C3AED","#0369A1","#059669","#DC2626","#D97706","#0891B2","#BE185D","#065F46"];
var STAFF=[]; // DB에서 동적으로 로드됨
const STATUSES=[
  {id:"발주",next:"주문",bg:"#F3E8FF",color:"#6B21A8",dot:"#A855F7"},
  {id:"주문",next:"수령",bg:"#CFFAFE",color:"#155E75",dot:"#06B6D4"},
  {id:"수령",next:"완료",bg:"#DCFCE7",color:"#14532D",dot:"#22C55E"},
  {id:"완료",next:null,bg:"#F1F5F9",color:"#475569",dot:"#94A3B8"},
];
function prevStatus(s){
  var idx=STATUSES.findIndex(function(x){return x.next===s;});
  return idx>=0?STATUSES[idx].id:null;
}
// 예전 명칭 → 새 명칭 매핑 (레거시 데이터 호환)
function normalizeStatus(s){
  if(s==="구매요청")return"발주";
  if(s==="주문완료")return"주문";
  if(s==="배송완료")return"수령";
  return s;
}
const DOW_LABELS=["일","월","화","수","목","금","토"];

// ── helpers ──
function uid(){return typeof crypto!=="undefined"&&crypto.randomUUID?crypto.randomUUID():"r-"+Date.now()+"-"+Math.random().toString(16).slice(2);}
function pad(n){return String(n).padStart(2,"0");}
function dateStr(d){d=d||new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function toLocalISO(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours())+":"+pad(d.getMinutes());}
function fmtDate(iso){if(!iso)return"";var d=new Date(iso);return d.getFullYear()+"."+pad(d.getMonth()+1)+"."+pad(d.getDate());}
function fmtTime(iso){if(!iso)return"";var d=new Date(iso);return pad(d.getHours())+":"+pad(d.getMinutes());}
function fmtDateTime(iso){if(!iso)return"";return fmtDate(iso)+" "+fmtTime(iso);}
function calcHours(s,e){if(!s||!e)return null;var d=(new Date(e)-new Date(s))/3600000;return d>0?d:null;}
function fmtHours(h){if(h==null)return"—";var hr=Math.floor(h),min=Math.round((h-hr)*60);return min===0?hr+"시간":hr+"시간 "+min+"분";}
function storeBadge(sid){var s=STORES.find(function(x){return x.id===sid;});return s?s.badge:{bg:"#F3F4F6",color:"#374151"};}
function staffColor(sid){var s=STAFF.find(function(x){return x.id===sid;});return s?s.color:"#6B7280";}
function staffName(sid){var s=STAFF.find(function(x){return x.id===sid;});return s?s.name:sid||"—";}
function statusCfg(s){return STATUSES.find(function(x){return x.id===s;})||STATUSES[1];}
function todoBadge(sid){var s=TODO_STORES.find(function(x){return x.id===sid;});return s?s.badge:{bg:"#F1F5F9",color:"#475569"};}
function getDow(ds){return new Date(ds+"T12:00:00").getDay();}
function getDatesForDows(startDs,endDs,dows){
  var result=[],cur=new Date(startDs+"T12:00:00"),end=new Date(endDs+"T12:00:00");
  while(cur<=end){if(dows.indexOf(cur.getDay())>=0)result.push(dateStr(cur));cur.setDate(cur.getDate()+1);}
  return result;
}
var holidayCache={};
var holidayAllDataPromise=null;
function fetchHolidays(year){
  if(holidayCache[year]!==undefined)return Promise.resolve(holidayCache[year]);
  if(!holidayAllDataPromise){
    holidayAllDataPromise=fetch("https://holidays.hyunbin.page/basic.json").then(function(r){return r.ok?r.json():Promise.reject();});
  }
  return holidayAllDataPromise.then(function(all){
    var yearData=all[String(year)]||{};
    var map={};
    Object.keys(yearData).forEach(function(dt){
      var names=yearData[dt];
      map[dt]=Array.isArray(names)?names.join(", "):names;
    });
    holidayCache[year]=map;
    return map;
  }).catch(function(){
    var fixed={};
    [[1,1,"신정"],[3,1,"삼일절"],[5,5,"어린이날"],[6,6,"현충일"],[8,15,"광복절"],[10,3,"개천절"],[10,9,"한글날"],[12,25,"크리스마스"]].forEach(function(x){fixed[year+"-"+pad(x[0])+"-"+pad(x[1])]=x[2];});
    holidayCache[year]=fixed;return fixed;
  });
}

const CSS=`
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
.ml-root{font-family:"Noto Sans KR",-apple-system,sans-serif;display:flex;flex-direction:column;height:100vh;height:100dvh;background:#F1F5F9;max-width:100vw;overflow:hidden;}
.ml-mono{font-family:"IBM Plex Mono",monospace;}
.ml-inp:focus,.ml-sel:focus{outline:2px solid #2563EB;outline-offset:2px;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;}
.modal-box{background:#fff;border-radius:12px;width:100%;max-width:480px;max-height:92vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.3);}
.fade-in{animation:fadeIn .18s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap;}

.ml-row.even td{background:#FAFAFA;}.ml-row.odd td{background:#fff;}

`;

// ── DayDetailModal (날짜별 근무 상세) ──
function DayDetailModal({date,works,currentUser,onClose,onEditWork}){
  var dayWorks=useMemo(function(){
    return works.filter(function(w){return w.startAt&&w.startAt.slice(0,10)===date;})
      .sort(function(a,b){return(a.startAt||"")>(b.startAt||"")?1:-1;});
  },[works,date]);

  var byStore=useMemo(function(){
    var map={};
    STORES.forEach(function(s){map[s.id]=dayWorks.filter(function(w){return w.storeId===s.id;});});
    return map;
  },[dayWorks]);

  var d=new Date(date+"T12:00:00");
  var DOW=["일","월","화","수","목","금","토"];
  var dateLabel=d.getFullYear()+"년 "+(d.getMonth()+1)+"월 "+d.getDate()+"일 ("+DOW[d.getDay()]+")";

  function canEdit(w){return currentUser.isAdmin||w.staffId===currentUser.id;}

  return(
    <div className="modal-overlay" onClick={function(e){if(e.target===e.currentTarget)onClose();}}>
      <div className="modal-box fade-in" style={{padding:24,color:"#1E293B"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
          <h2 style={{fontSize:16,fontWeight:700}}>{dateLabel}</h2>
          <button type="button" onClick={onClose} style={{background:"none",border:"none",cursor:"pointer"}}><X size={18}/></button>
        </div>

        {dayWorks.length===0?(
          <div style={{padding:"24px 0",textAlign:"center",fontSize:12,color:"#94A3B8"}}>등록된 근무가 없어요.</div>
        ):(
          STORES.map(function(s){
            var list=byStore[s.id]||[];
            if(list.length===0)return null;
            var b=s.badge;
            return(
              <div key={s.id} style={{marginBottom:16}}>
                <div style={{fontSize:11,fontWeight:700,color:b.color,marginBottom:8,padding:"2px 8px",background:b.bg,borderRadius:4,display:"inline-block"}}>{s.id}</div>
                {list.map(function(w){
                  var hours=calcHours(w.startAt,w.endAt);
                  var sc=staffColor(w.staffId);
                  var editable=canEdit(w);
                  return(
                    <div key={w.id} onClick={function(){if(editable)onEditWork(w);}}
                      style={{display:"flex",alignItems:"center",gap:8,padding:"8px 4px",borderBottom:"1px solid #F1F5F9",cursor:editable?"pointer":"default"}}>
                      <span style={{width:7,height:7,borderRadius:"50%",background:sc,display:"inline-block",flexShrink:0}}/>
                      <span style={{fontSize:12,fontWeight:600,color:"#1E293B",width:52,flexShrink:0}}>{staffName(w.staffId)}</span>
                      <span className="ml-mono" style={{fontSize:11,color:"#374151",flex:1}}>
                        {fmtTime(w.startAt)} ~ {w.endAt?fmtTime(w.endAt):"미입력"}
                      </span>
                      {hours!=null&&<span style={{fontSize:10,fontWeight:600,padding:"2px 8px",borderRadius:999,background:"#F0FDF4",color:"#15803D",whiteSpace:"nowrap"}}>{fmtHours(hours)}</span>}
                      {w.memo&&<span style={{fontSize:10,color:"#94A3B8",whiteSpace:"nowrap",maxWidth:60,overflow:"hidden",textOverflow:"ellipsis"}}>{w.memo}</span>}
                    </div>
                  );
                })}
              </div>
            );
          })
        )}

        <div style={{display:"flex",justifyContent:"flex-end",marginTop:8}}>
          <button type="button" onClick={onClose} style={{padding:"8px 20px",border:"1px solid #CBD5E1",borderRadius:6,fontSize:12,color:"#64748B",background:"#fff",cursor:"pointer"}}>닫기</button>
        </div>
      </div>
    </div>
  );
}

// ── WorkModal ──
function WorkModal({record,defaultDate,forceStaffId,defaultStaffId,normalHours,onClose,onSave,onDelete}){
  var isEdit=!!record;
  var now=new Date();
  var initDate=defaultDate||dateStr(now);
  var initStaffId=isEdit?record.staffId:(forceStaffId||defaultStaffId||STAFF[0]&&STAFF[0].id||"");
  var initDow0=getDow(initDate);
  var initIsWeekendGuess=(initDow0===0||initDow0===6); // 공휴일 조회 전까지는 주말만으로 1차 추정
  var [holidayMap,setHolidayMap]=useState(null);
  var [form,setForm]=useState(isEdit?{
    staffId:record.staffId,storeId:record.storeId,
    startAt:record.startAt?toLocalISO(new Date(record.startAt)):"",
    endAt:record.endAt?toLocalISO(new Date(record.endAt)):"",
    memo:record.memo||"",
  }:{staffId:initStaffId,storeId:STORES[0].id,startAt:initDate+"T"+(initIsWeekendGuess?"12:00":"14:00"),endAt:initDate+"T23:00",memo:""});

  // 정규 근무시간 조회 (직원+요일별, 등록하려는 날짜 시점에 유효했던 규칙 기준)
  function normalHoursFor(staffId,dateStr10){
    var dow=getDow(dateStr10);
    var candidates=(normalHours||[]).filter(function(h){
      if(h.staffId!==staffId||h.dow!==dow)return false;
      if(h.validFrom&&dateStr10<h.validFrom)return false;
      if(h.validTo&&dateStr10>h.validTo)return false;
      return true;
    });
    if(candidates.length===0)return null;
    candidates.sort(function(a,b){return(b.validFrom||"")>(a.validFrom||"")?1:-1;});
    var staffRule=candidates[0];
    return staffRule?{start:staffRule.startTime,end:staffRule.endTime}:null;
  }

  // 사용자가 시간을 직접 건드리지 않았을 때만 자동 보정 대상
  var [startTouched,setStartTouched]=useState(false);
  var [endTouched,setEndTouched]=useState(false);

  function applySuggestedTime(staffId,hMap){
    if(isEdit)return;
    if(startTouched&&endTouched)return;
    var rule=normalHoursFor(staffId,initDate);
    var suggestedStart=rule&&rule.start;
    var suggestedEnd=rule&&rule.end;
    if(!suggestedStart){
      var dow=getDow(initDate);
      var isHoliday=(hMap&&!!hMap[initDate])||dow===0||dow===6;
      suggestedStart=isHoliday?"12:00":"14:00";
    }
    setForm(function(prev){
      var next={...prev};
      if(!startTouched)next.startAt=initDate+"T"+suggestedStart;
      if(!endTouched&&suggestedEnd)next.endAt=initDate+"T"+suggestedEnd;
      return next;
    });
  }

  // 공휴일 정보를 실시간으로 가져와서 신규 등록 시 시간 자동 보정 (사용자가 아직 손대지 않았을 때만)
  useEffect(function(){
    if(isEdit)return;
    var yr=initDate.slice(0,4);
    fetchHolidays(yr).then(function(h){
      setHolidayMap(h);
      applySuggestedTime(initStaffId,h);
    });
  },[]);
  var [repeat,setRepeat]=useState(false);
  var initDow=getDow(initDate);
  var [repeatDows,setRepeatDows]=useState([initDow]);
  var [repeatEnd,setRepeatEnd]=useState(function(){var d=new Date(initDate+"T12:00:00");d.setDate(d.getDate()+27);return dateStr(d);});
  var [previewCount,setPreviewCount]=useState(0);
  var [err,setErr]=useState({});
  var [saving,setSaving]=useState(false);
  var hours=calcHours(form.startAt,form.endAt);

  useEffect(function(){
    if(!repeat||repeatDows.length===0){setPreviewCount(0);return;}
    var startDs=form.startAt.slice(0,10)||initDate;
    setPreviewCount(getDatesForDows(startDs,repeatEnd,repeatDows).length);
  },[repeat,repeatDows,repeatEnd,form.startAt]);

  function toggleDow(d){setRepeatDows(function(prev){return prev.indexOf(d)>=0?prev.filter(function(x){return x!==d;}):[...prev,d].sort();});}

  function submit(e){
    e.preventDefault();
    var er={};
    if(!form.staffId)er.staffId="직원을 선택해주세요.";
    if(!form.storeId)er.storeId="매장을 선택해주세요.";
    if(!form.startAt)er.startAt="출근 시간을 입력해주세요.";
    if(form.endAt&&form.startAt&&new Date(form.endAt)<=new Date(form.startAt))er.endAt="종료 시간이 시작보다 빠릅니다.";
    if(repeat&&repeatDows.length===0)er.repeat="요일을 선택해주세요.";
    if(Object.keys(er).length){setErr(er);return;}
    setSaving(true);
    var startTime=form.startAt.slice(11);
    var endTime=form.endAt?form.endAt.slice(11):"";
    var rows=[];
    if(!isEdit&&repeat&&repeatDows.length>0){
      var startDs=form.startAt.slice(0,10);
      var dates=getDatesForDows(startDs,repeatEnd,repeatDows);
      var allDates=dates.length>0?dates:[startDs];
      rows=allDates.map(function(ds){return{id:uid(),staffId:form.staffId,storeId:form.storeId,startAt:new Date(ds+"T"+startTime).toISOString(),endAt:endTime?new Date(ds+"T"+endTime).toISOString():null,memo:form.memo};});
    } else {
      rows=[{id:isEdit?record.id:uid(),staffId:form.staffId,storeId:form.storeId,startAt:new Date(form.startAt).toISOString(),endAt:form.endAt?new Date(form.endAt).toISOString():null,memo:form.memo}];
    }
    onSave(rows).then(function(){setSaving(false);}).catch(function(){setSaving(false);});
  }

  return (
    <div className="modal-overlay" onClick={function(e){if(e.target===e.currentTarget)onClose();}}>
      <form className="modal-box fade-in" onSubmit={submit} style={{padding:24,color:"#1E293B"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
          <h2 style={{fontSize:16,fontWeight:700}}>{isEdit?"근무 기록 수정":"근무 일정 등록"}</h2>
          <button type="button" onClick={onClose} style={{background:"none",border:"none",cursor:"pointer"}}><X size={18}/></button>
        </div>
        <div style={{marginBottom:14}}>
          <label style={{display:"block",fontSize:12,fontWeight:500,marginBottom:6}}>직원 *</label>
          <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
            {STAFF.map(function(s){
              var locked=!!forceStaffId; // 비관리자는 신규/수정 모두 잠금
              return(
                <button key={s.id} type="button"
                  onClick={function(){if(!locked){setForm({...form,staffId:s.id});applySuggestedTime(s.id,holidayMap);}}}
                  style={{padding:"6px 14px",borderRadius:999,fontSize:12,fontWeight:600,
                    border:"2px solid "+(form.staffId===s.id?s.color:"#E2E8F0"),
                    background:form.staffId===s.id?s.color:"#fff",
                    color:form.staffId===s.id?"#fff":"#374151",
                    cursor:locked?"default":"pointer",
                    opacity:locked&&form.staffId!==s.id?0.3:1}}>
                  {s.name}
                </button>
              );
            })}
          </div>
          {!!forceStaffId&&<p style={{fontSize:10,color:"#94A3B8",marginTop:4}}>본인 명의로만 등록/수정할 수 있어요.</p>}
          {err.staffId&&<p style={{fontSize:11,color:"#EF4444",marginTop:4}}>{err.staffId}</p>}
        </div>
        <div style={{marginBottom:14}}>
          <label style={{display:"block",fontSize:12,fontWeight:500,marginBottom:6}}>매장 *</label>
          <div style={{display:"flex",gap:10}}>
            {STORES.map(function(s){var b=s.badge;return(
              <button key={s.id} type="button" onClick={function(){setForm({...form,storeId:s.id});}}

  var [err,setErr]=useState("");

  var histByStore=useMemo(function(){
    var m={};
    STORES.forEach(function(s){
      m[s.id]=(history||[]).filter(function(h){return h.itemId===item.id&&h.storeId===s.id;}).sort(function(a,b){return b.changedAt>a.changedAt?1:-1;}).slice(0,8);

                    border:"1.5px solid "+(categoryId===c.id?"#2563EB":"#E2E8F0"),
                    background:categoryId===c.id?"#EFF6FF":"#fff",

// ── TodoModal ──
function TodoModal({todo,currentUser,todoCategories,onClose,onSave,onDelete}){
  var isEdit=!!(todo&&todo.id);
  var [form,setForm]=useState({
    title:todo&&todo.title||"",storeId:todo&&todo.storeId||STORES[0].id,detail:todo&&todo.detail||"",categoryId:todo&&todo.categoryId||"",
  });
  var [subitems,setSubitems]=useState(["","",""]); // 신규 등록 시 세부항목 (최소 1개 이상 입력해야함)
  var [err,setErr]=useState("");
  var [saving,setSaving]=useState(false);

  function updateSubitem(idx,value){
    setSubitems(function(prev){var next=[...prev];next[idx]=value;return next;});
  }
  function addSubitemField(){setSubitems(function(prev){return[...prev,""];});}
  function removeSubitemField(idx){setSubitems(function(prev){return prev.filter(function(_,i){return i!==idx;});});}

  function submit(e){
    e.preventDefault();
    if(!form.title.trim()){setErr("할 일 제목을 입력해주세요.");return;}
    var cleanSubitems=subitems.map(function(s){return s.trim();}).filter(Boolean);
    if(!isEdit&&cleanSubitems.length===0){setErr("세부항목을 최소 1개 입력해주세요.");return;}
    setSaving(true);
    onSave({id:(todo&&todo.id)||uid(),...form,title:form.title.trim(),detail:form.detail.trim(),categoryId:form.categoryId||null,subitems:cleanSubitems}).then(function(){setSaving(false);}).catch(function(){setSaving(false);});
  }

  return(
    <div className="modal-overlay" onClick={function(e){if(e.target===e.currentTarget)onClose();}}>
      <form className="modal-box fade-in" onSubmit={submit} style={{padding:24,color:"#1E293B"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
          <h2 style={{fontSize:16,fontWeight:700}}>{isEdit?"할 일 수정":"할 일 추가"}</h2>
          <button type="button" onClick={onClose} style={{background:"none",border:"none",cursor:"pointer"}}><X size={18}/></button>
        </div>
        {isEdit&&(
          <div style={{marginBottom:14,display:"flex",alignItems:"center",gap:6,fontSize:11,color:"#94A3B8"}}>
            <span style={{width:7,height:7,borderRadius:"50%",background:staffColor(todo.staffId),display:"inline-block"}}/>
            요청자: <span style={{fontWeight:600,color:"#374151"}}>{staffName(todo.staffId)}</span>
          </div>
        )}
        <div style={{marginBottom:14}}>
          <label style={{display:"block",fontSize:12,fontWeight:500,marginBottom:4}}>제목 *</label>
          <input value={form.title} onChange={function(e){setForm({...form,title:e.target.value});setErr("");}}
            className="ml-inp" autoFocus style={{width:"100%",padding:"8px 12px",border:"1px solid "+(err?"#EF4444":"#CBD5E1"),borderRadius:6,fontSize:12,outline:"none"}} placeholder="할 일 내용을 입력하세요"/>
        </div>
        <div style={{marginBottom:14}}>
          <label style={{display:"block",fontSize:12,fontWeight:500,marginBottom:6}}>담당 매장</label>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            {TODO_STORES.map(function(s){var b=s.badge;return(
              <button key={s.id} type="button" onClick={function(){setForm({...form,storeId:s.id});}}
                style={{padding:"6px 14px",borderRadius:999,fontSize:11,fontWeight:600,cursor:"pointer",border:"2px solid "+(form.storeId===s.id?b.color:"#E2E8F0"),background:form.storeId===s.id?b.bg:"#fff",color:form.storeId===s.id?b.color:"#94A3B8"}}>
                {s.id}
              </button>
            );})}
          </div>
        </div>
        {todoCategories&&todoCategories.length>0&&(
          <div style={{marginBottom:14}}>
            <label style={{display:"block",fontSize:12,fontWeight:500,marginBottom:6}}>분류</label>
            <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
              <button type="button" onClick={function(){setForm({...form,categoryId:""});}}
                style={{padding:"5px 13px",borderRadius:999,fontSize:11,fontWeight:600,cursor:"pointer",border:"1.5px solid "+(form.categoryId===""?"#334155":"#E2E8F0"),background:form.categoryId===""?"#334155":"#fff",color:form.categoryId===""?"#fff":"#94A3B8"}}>
                없음
              </button>
              {todoCategories.map(function(c){return(
                <button key={c.id} type="button" onClick={function(){setForm({...form,categoryId:c.id});}}
                  style={{padding:"5px 13px",borderRadius:999,fontSize:11,fontWeight:600,cursor:"pointer",border:"1.5px solid "+(form.categoryId===c.id?"#2563EB":"#E2E8F0"),background:form.categoryId===c.id?"#EFF6FF":"#fff",color:form.categoryId===c.id?"#2563EB":"#94A3B8"}}>
                  {c.name}
                </button>
              );})}
            </div>
          </div>
        )}
        <div style={{marginBottom:14}}>
          <label style={{display:"block",fontSize:12,fontWeight:500,marginBottom:4}}>부가 설명</label>
          <textarea value={form.detail} onChange={function(e){setForm({...form,detail:e.target.value});}}
            className="ml-inp" style={{width:"100%",padding:"8px 12px",border:"1px solid #CBD5E1",borderRadius:6,fontSize:12,outline:"none",resize:"vertical",minHeight:60}} placeholder="간단한 설명이나 참고사항"/>
        </div>
        {!isEdit&&(
          <div style={{marginBottom:20}}>
            <label style={{display:"block",fontSize:12,fontWeight:500,marginBottom:6}}>세부항목 *</label>
            {subitems.map(function(v,idx){return(
              <div key={idx} style={{display:"flex",gap:6,marginBottom:6}}>

                {subitems.length>1&&(

                    style={{background:"none",border:"none",cursor:"pointer",color:"#CBD5E1",padding:"0 4px"}}>

                )}

            );})}
            <button type="button" onClick={addSubitemField}
              style={{width:"100%",padding:"7px",background:"#F8FAFC",color:"#64748B",border:"1px dashed #CBD5E1",borderRadius:6,fontSize:11,fontWeight:600,cursor:"pointer",marginTop:2}}>
              + 항목 추가
            </button>
            {err&&<p style={{fontSize:11,color:"#EF4444",marginTop:6}}>{err}</p>}
          </div>
        )}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          {isEdit?(
            <button type="button" onClick={function(){onDelete(todo);}}
              style={{display:"inline-flex",alignItems:"center",gap:6,padding:"8px 14px",border:"1px solid #FECACA",borderRadius:6,fontSize:12,color:"#DC2626",background:"#FEF2F2",cursor:"pointer"}}>
              <Trash2 size={13}/> 삭제
            </button>
          ):<span/>}
          <div style={{display:"flex",gap:8}}>
            <button type="button" onClick={onClose} style={{padding:"8px 16px",border:"1px solid #CBD5E1",borderRadius:6,fontSize:12,color:"#64748B",background:"#fff",cursor:"pointer"}}>취소</button>
            <button type="submit" disabled={saving} style={{padding:"8px 18px",background:"#2563EB",color:"#fff",borderRadius:6,fontSize:12,border:"none",cursor:"pointer",opacity:saving?0.6:1}}>
              {saving?"저장 중…":isEdit?"수정":"추가"}
            </button>
          </div>
        </div>
      </form>
    </div>
  );
}

// ── CalendarView ──
function CalendarView({works,events,onDayClick,onWorkClick,onEventClick,onAddWork,filterStaff,filterStore}){
  filterStaff=filterStaff||"all";filterStore=filterStore||"all";
  var today=new Date();
  var [year,setYear]=useState(today.getFullYear());
  var [month,setMonth]=useState(today.getMonth());
  var [holidays,setHolidays]=useState({});
  useEffect(function(){fetchHolidays(year).then(function(h){setHolidays(h);});;},[year]);
  function prevMonth(){if(month===0){setYear(function(y){return y-1;});setMonth(11);}else setMonth(function(m){return m-1;});}
  function nextMonth(){if(month===11){setYear(function(y){return y+1;});setMonth(0);}else setMonth(function(m){return m+1;});}
  var firstDay=new Date(year,month,1).getDay();
  var daysInMonth=new Date(year,month+1,0).getDate();
  var todayStr=dateStr(today);
  var worksByDate=useMemo(function(){
    var map={};
    works.filter(function(w){
      if(!w.startAt)return false;
      if(filterStaff!=="all"&&w.staffId!==filterStaff)return false;
      if(filterStore!=="all"&&w.storeId!==filterStore)return false;
      return true;
    }).forEach(function(w){
      var d=w.startAt.slice(0,10);
      if(d.slice(0,7)!==year+"-"+pad(month+1))return;
      if(!map[d])map[d]={};
      if(!map[d][w.storeId])map[d][w.storeId]=[];
      map[d][w.storeId].push(w);
    });
    Object.values(map).forEach(function(byStore){
      Object.keys(byStore).forEach(function(sid){byStore[sid].sort(function(a,b){return(a.startAt||"")>(b.startAt||"")?1:-1;});});
    });
    return map;
  },[works,year,month,filterStaff,filterStore]);

  var eventsByDate=useMemo(function(){
    var map={};
    (events||[]).forEach(function(ev){
      if(!ev.eventDate)return;
      if(ev.eventDate.slice(0,7)!==year+"-"+pad(month+1))return;
      if(!map[ev.eventDate])map[ev.eventDate]=[];
      map[ev.eventDate].push(ev);
    });
    Object.values(map).forEach(function(list){list.sort(function(a,b){return(a.eventTime||"")>(b.eventTime||"")?1:-1;});});
    return map;
  },[events,year,month]);

  var DOW=["일","월","화","수","목","금","토"];
  var cells=[];
  for(var i=0;i<firstDay;i++)cells.push(null);
  for(var d=1;d<=daysInMonth;d++)cells.push(d);

  return(
    <div style={{padding:"16px 20px 32px",maxWidth:960,margin:"0 auto"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
        <button onClick={prevMonth} style={{display:"inline-flex",alignItems:"center",padding:"6px 10px",border:"1px solid #E2E8F0",borderRadius:8,background:"#fff",cursor:"pointer"}}><CL size={16}/></button>
        <h2 style={{fontSize:17,fontWeight:700,color:"#0F172A"}}>{year}년 {month+1}월</h2>
        <button onClick={nextMonth} style={{display:"inline-flex",alignItems:"center",padding:"6px 10px",border:"1px solid #E2E8F0",borderRadius:8,background:"#fff",cursor:"pointer"}}><CR size={16}/></button>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4,marginBottom:4}}>
        {DOW.map(function(d,i){return(
          <div key={d} style={{textAlign:"center",fontSize:11,fontWeight:700,padding:"6px 0",color:i===0?"#EF4444":i===6?"#3B82F6":"#64748B"}}>{d}</div>
        );})}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4}}>
        {cells.map(function(day,idx){
          if(!day)return <div key={"e"+idx}/>;
          var ds=year+"-"+pad(month+1)+"-"+pad(day);
          var dow=(firstDay+day-1)%7;
          var isToday=ds===todayStr;
          var holiday=holidays[ds];
          var isHoliday=!!holiday||dow===0;
          var isSat=dow===6;
          var dayWorks=worksByDate[ds]||{};
          var dayEvents=eventsByDate[ds]||[];
          return(
            <div key={ds} className="cal-day" onClick={function(){onDayClick(ds);}}
              style={{position:"relative",minHeight:90,padding:"6px 7px",background:isToday?"#EFF6FF":"#fff",border:isToday?"1.5px solid #3B82F6":"1px solid #E2E8F0",borderRadius:8,overflow:"hidden"}}>
              <button onClick={function(e){e.stopPropagation();onAddWork(ds);}}
                style={{position:"absolute",top:4,right:4,width:16,height:16,borderRadius:"50%",border:"none",background:"rgba(148,163,184,.15)",color:"#94A3B8",fontSize:11,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",lineHeight:1,padding:0,zIndex:1}}>
                +
              </button>
              <div style={{display:"flex",alignItems:"center",gap:4,marginBottom:4}}>
                <span style={{fontSize:12,fontWeight:isToday?700:500,color:isToday?"#fff":isHoliday?"#EF4444":isSat?"#3B82F6":"#1E293B",width:22,height:22,display:"inline-flex",alignItems:"center",justifyContent:"center",borderRadius:"50%",background:isToday?"#3B82F6":"transparent"}}>
                  {day}
                </span>
              </div>
              {(holiday||dayEvents.length>0)&&(
                <div style={{display:"flex",flexDirection:"column",gap:2,marginBottom:4}}>
                  {holiday&&(
                    <div style={{fontSize:9,fontWeight:700,padding:"2px 4px",borderRadius:4,background:"#FEE2E2",color:"#991B1B",lineHeight:1.3,width:"100%",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                      {holiday}
                    </div>
                  )}
                  {dayEvents.map(function(ev){return(
                    <button key={ev.id} onClick={function(e){e.stopPropagation();onEventClick(ev);}}
                      style={{fontSize:9,fontWeight:700,padding:"2px 4px",borderRadius:4,background:"#F3E8FF",color:"#6B21A8",border:"1px solid #E9D5FF",cursor:"pointer",lineHeight:1.3,width:"100%",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",textAlign:"left",display:"block"}}>
                      {ev.title}
                    </button>
                  );})}
                </div>
              )}
              {STORES.map(function(s){
                var ws=dayWorks[s.id]||[];
                if(ws.length===0)return null;
                var b=s.badge;
                return(
                  <div key={s.id} style={{marginBottom:3}}>
                    <div style={{fontSize:9,fontWeight:700,color:b.color,marginBottom:1,whiteSpace:"nowrap"}}>{s.id}</div>
                    <div style={{display:"flex",flexWrap:"wrap",gap:2}}>
                      {ws.map(function(w){return(
                        <button key={w.id} onClick={function(e){e.stopPropagation();onWorkClick(w);}}
                          style={{fontSize:9,fontWeight:600,padding:"2px 4px",borderRadius:4,background:staffColor(w.staffId)+"22",color:staffColor(w.staffId),border:"1px solid "+staffColor(w.staffId)+"44",cursor:"pointer",whiteSpace:"nowrap",lineHeight:1.3,flexShrink:0}}>
                          {staffName(w.staffId)}
                        </button>
                      );})}
                    </div>
                  </div>
                );
              })}
            </div>
          );
        })}
      </div>
      <div style={{display:"flex",flexWrap:"wrap",gap:10,marginTop:16,padding:"12px 16px",background:"#fff",borderRadius:10,border:"1px solid #E2E8F0"}}>
        <span style={{fontSize:10,fontWeight:700,color:"#94A3B8",marginRight:4}}>직원</span>
        {STAFF.map(function(s){return(
          <span key={s.id} style={{fontSize:10,fontWeight:600,padding:"2px 8px",borderRadius:4,background:s.color+"22",color:s.color,border:"1px solid "+s.color+"44",whiteSpace:"nowrap",flexShrink:0}}>{s.name}</span>
        );})}
        <span style={{fontSize:10,color:"#94A3B8",marginLeft:8}}>날짜 클릭 시 근무 등록</span>
      </div>
    </div>
  );
}

// ── WorkListView ──
// ── NormalHoursModal (요일별/매장별 정규 근무시간 설정) ──
// ── NormalHoursModal (직원별 정규 근무시간 설정, 공휴일 우선) ──
// ── NormalHoursModal (직원별 요일별 정규 근무시간, 공휴일 우선) ──
function NormalHoursModal({normalHours,onClose,onSave}){
  var DOW_KR=["일","월","화","수","목","금","토"];
  var TIME_OPTIONS=[];
  for(var h=0;h<24;h++)TIME_OPTIONS.push(pad(h)+":00");

  var [selectedStaffId,setSelectedStaffId]=useState(STAFF[0]&&STAFF[0].id||"");
  var [showHistory,setShowHistory]=useState(false);

  var activeRules=useMemo(function(){
    return(normalHours||[]).filter(function(h){return h.validTo===null;});
  },[normalHours]);

  // key: staffId+"_"+dow -> {start,end}
  var initialRows=useMemo(function(){
    var m={};
    activeRules.forEach(function(h){
      if(!h.staffId)return;
      m[h.staffId+"_"+h.dow]={start:h.startTime||"",end:h.endTime||""};
    });
    return m;
  },[activeRules]);
  var [rows,setRows]=useState(initialRows);
  var [saving,setSaving]=useState(false);

  function keyOf(staffId,dow){return staffId+"_"+dow;}
  function updateRow(staffId,dow,field,value){
    var k=keyOf(staffId,dow);
    setRows(function(prev){
      var cur=prev[k]||{start:"",end:""};
      var next={...cur};
      next[field]=value;
      return{...prev,[k]:next};
    });
  }

  function submit(){
    if(!window.confirm("저장하면 오늘부터 새 정규 근무시간이 적용돼요. 이전 설정은 이력으로 남고 과거 기록 조회에는 계속 사용돼요. 계속할까요?"))return;
    setSaving(true);
    var entries=[];
    STAFF.forEach(function(s){
      for(var d=0;d<7;d++){
        var k=keyOf(s.id,d);
        var r=rows[k];
        if(r&&(r.start||r.end)){
          entries.push({id:uid(),staffId:s.id,dow:d,startTime:r.start||null,endTime:r.end||null,isHoliday:false});
        }
      }
    });
    onSave(entries).then(function(){setSaving(false);onClose();}).catch(function(){setSaving(false);});
  }

  var selectedStaff=STAFF.find(function(s){return s.id===selectedStaffId;});

  var historyByStaff=useMemo(function(){
    var m={};
    (normalHours||[]).forEach(function(h){
      if(!h.staffId)return;
      if(!m[h.staffId])m[h.staffId]=[];
      m[h.staffId].push(h);
    });
    Object.keys(m).forEach(function(sid){
      m[sid].sort(function(a,b){return(b.validFrom||"")>(a.validFrom||"")?1:-1;});
    });
    return m;
  },[normalHours]);

  var selectedHistoryGroups=useMemo(function(){
    var list=historyByStaff[selectedStaffId]||[];
    var groups={};
    list.forEach(function(h){
      var key=h.validFrom||"—";
      if(!groups[key])groups[key]=[];
      groups[key].push(h);
    });
    var keys=Object.keys(groups).sort().reverse();
    return keys.map(function(vf){
      var g=groups[vf];
      return{
        validFrom:vf,
        validTo:g[0].validTo,
        isActive:g.some(function(h){return h.validTo===null;}),
        items:g
      };
    });
  },[historyByStaff,selectedStaffId]);

  return(
    <div className="modal-overlay" onClick={function(e){if(e.target===e.currentTarget)onClose();}}>
      <div className="modal-box fade-in" style={{padding:24,color:"#1E293B",maxWidth:520}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:6}}>
          <h2 style={{fontSize:16,fontWeight:700}}>정규 근무시간 설정</h2>
          <button type="button" onClick={onClose} style={{background:"none",border:"none",cursor:"pointer"}}><X size={18}/></button>
        </div>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
          <p style={{fontSize:11,color:"#94A3B8"}}>직원별로 요일마다 정규 근무시간을 설정하면, 다른 시간의 근무 기록이 목록에서 하이라이트돼요. 저장 시 오늘부터 새로 적용돼요.</p>
          <button type="button" onClick={function(){setShowHistory(!showHistory);}}
            style={{flexShrink:0,marginLeft:10,padding:"4px 10px",background:showHistory?"#1E293B":"#F8FAFC",color:showHistory?"#fff":"#374151",border:"1px solid #E2E8F0",borderRadius:6,fontSize:10,fontWeight:600,cursor:"pointer",whiteSpace:"nowrap"}}>
            {showHistory?"편집으로":"이력 보기"}
          </button>
        </div>

        <div style={{marginBottom:10}}>
          <div style={{fontSize:11,fontWeight:700,color:"#64748B",marginBottom:8}}>직원별 요일 근무시간</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:12}}>
            {STAFF.map(function(s){var active=selectedStaffId===s.id;return(
              <button key={s.id} type="button" onClick={function(){setSelectedStaffId(s.id);}}
                style={{padding:"5px 13px",borderRadius:999,fontSize:11,fontWeight:600,cursor:"pointer",
                  border:"2px solid "+(active?s.color:"#E2E8F0"),
                  background:active?s.color:"#fff",
                  color:active?"#fff":"#374151"}}>
                {s.name}
              </button>
            );})}
          </div>
        </div>

        {showHistory?(
          <div style={{maxHeight:360,overflowY:"auto",marginBottom:16}}>
            {selectedStaff&&selectedHistoryGroups.length===0&&(
              <p style={{fontSize:11,color:"#CBD5E1",padding:"12px 0"}}>등록된 이력이 없어요.</p>
            )}
            {selectedStaff&&selectedHistoryGroups.map(function(g){
              return(
                <div key={g.validFrom} style={{marginBottom:14,padding:"10px 12px",background:g.isActive?"#EFF6FF":"#F8FAFC",borderRadius:8,border:"1px solid "+(g.isActive?"#BFDBFE":"#E2E8F0")}}>
                  <div style={{fontSize:11,fontWeight:700,color:g.isActive?"#2563EB":"#64748B",marginBottom:6}}>
                    {g.validFrom} ~ {g.validTo||"현재"} {g.isActive?"(적용중)":""}
                  </div>
                  {g.items.map(function(h){return(
                    <div key={h.id} style={{display:"flex",alignItems:"center",gap:8,fontSize:11,color:"#374151",padding:"2px 0"}}>
                      <span style={{width:20,fontWeight:600,color:(h.dow===0?"#EF4444":h.dow===6?"#3B82F6":"#374151")}}>{DOW_KR[h.dow]}</span>
                      <span className="ml-mono">{h.startTime||"—"} ~ {h.endTime||"—"}</span>
                    </div>
                  );})}
                </div>
              );
            })}
          </div>
        ):(
        selectedStaff&&(
          <div style={{maxHeight:320,overflowY:"auto",marginBottom:16}}>
            {DOW_KR.map(function(dowLabel,d){
              var k=keyOf(selectedStaffId,d);
              var r=rows[k]||{start:"",end:""};
              return(
                <div key={d} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 0",borderBottom:"1px solid #F1F5F9"}}>

function WorkListView({works,currentUser,normalHours,holidayMap,onEdit,onDelete,onBulkDelete}){
  var DOW_KR=["일","월","화","수","목","금","토"];
  function dowOf(dateStr10){return DOW_KR[new Date(dateStr10+"T12:00:00").getDay()];}
  var today=new Date();
  var curMonth=today.getFullYear()+"-"+pad(today.getMonth()+1);
  var [filter,setFilter]=useState({staff:"all",month:curMonth});
  var [sort,setSort]=useState({key:"startAt",dir:"desc"});
  var [checked,setChecked]=useState(new Set());
  var months=useMemo(function(){var s=new Set(works.map(function(w){return w.startAt&&w.startAt.slice(0,7);}).filter(Boolean));return [...s].sort().reverse();},[works]);
  var filtered=useMemo(function(){
    var l=[...works];
    if(filter.staff!=="all")l=l.filter(function(w){return w.staffId===filter.staff;});
    if(filter.month)l=l.filter(function(w){return w.startAt&&w.startAt.slice(0,7)===filter.month;});
    return l.sort(function(a,b){var av=a[sort.key]||"",bv=b[sort.key]||"";var c=av<bv?-1:av>bv?1:0;return sort.dir==="asc"?c:-c;});
  },[works,filter,sort]);
  var monthFiltered=useMemo(function(){
    var l=[...works];
    if(filter.month)l=l.filter(function(w){return w.startAt&&w.startAt.slice(0,7)===filter.month;});
    return l;
  },[works,filter.month]);
  var allStaffTotals=useMemo(function(){
    var map={};
    STAFF.forEach(function(s){map[s.id]={id:s.id,name:s.name,color:s.color,hours:0,count:0};});
    monthFiltered.forEach(function(w){if(!map[w.staffId])return;var h=calcHours(w.startAt,w.endAt)||0;map[w.staffId].hours+=h;map[w.staffId].count+=1;});
    return Object.values(map).filter(function(x){return x.count>0;});
  },[monthFiltered]);
  function toggleSort(k){setSort(function(s){return s.key===k?{...s,dir:s.dir==="asc"?"desc":"asc"}:{key:k,dir:"desc"};});}
  function SI({k}){if(sort.key!==k)return <CD size={11} style={{opacity:0.3}}/>;return sort.dir==="asc"?<CU size={11}/>:<CD size={11}/>;}
  var canEdit=function(w){return currentUser.isAdmin||w.staffId===currentUser.id;};
  var checkable=filtered.filter(canEdit);
  function toggleCheck(id,w){if(!canEdit(w))return;setChecked(function(prev){var n=new Set(prev);n.has(id)?n.delete(id):n.add(id);return n;});}
  function toggleAll(){checked.size===checkable.length&&checkable.length>0?setChecked(new Set()):setChecked(new Set(checkable.map(function(w){return w.id;})));}
  function handleBulkDelete(){if(checked.size===0)return;if(!window.confirm("선택한 "+checked.size+"건의 근무 기록을 삭제할까요?"))return;onBulkDelete([...checked]);setChecked(new Set());}

  // 특정 날짜 기준으로 그 시점에 유효했던 규칙 하나를 찾음 (직원+요일)
  function findRuleAt(staffId,dow,ds){
    var candidates=(normalHours||[]).filter(function(h){
      if(h.staffId!==staffId||h.dow!==dow)return false;
      if(h.validFrom&&ds<h.validFrom)return false;
      if(h.validTo&&ds>h.validTo)return false;
      return true;
    });
    if(candidates.length===0)return null;
    // 여러 개면 validFrom이 가장 최근인 것 사용
    candidates.sort(function(a,b){return(b.validFrom||"")>(a.validFrom||"")?1:-1;});
    return candidates[0];
  }
  // 특정 날짜 기준, 그 직원이 정규시간 관리 대상이었는지(그 시점에 규칙이 하나라도 있었는지)
  function staffManagedAt(staffId,ds){
    return(normalHours||[]).some(function(h){
      if(h.staffId!==staffId)return false;
      if(h.validFrom&&ds<h.validFrom)return false;
      if(h.validTo&&ds>h.validTo)return false;
      return true;
    });
  }

  function isAbnormal(w){
    if(!w.startAt)return false;
    var ds=w.startAt.slice(0,10);
    if(!staffManagedAt(w.staffId,ds))return false; // 그 시점에 이 직원은 정규시간 관리 대상이 아니었음
    var dow=new Date(ds+"T12:00:00").getDay();
    var rule=findRuleAt(w.staffId,dow,ds);
    if(!rule||(!rule.startTime&&!rule.endTime)){
      // 그 시점 기준으로 이 요일엔 근무하지 않는 것으로 정의되어 있었음
      return true;
    }
    var actualStart=fmtTime(w.startAt);
    var actualEnd=w.endAt?fmtTime(w.endAt):null;
    if(rule.startTime&&actualStart!==rule.startTime)return true;
    if(rule.endTime&&actualEnd&&actualEnd!==rule.endTime)return true;
    return false;
  }

  return(

          <option value="">전체 기간</option>
          {months.map(function(m){return <option key={m} value={m}>{m}</option>;})}
        </select>
        <span className="ml-mono" style={{fontSize:10,color:"#94A3B8"}}>{filtered.length}건</span>
        {checked.size>0&&(

            <Trash2 size={12}/> {checked.size}건 삭제
          </button>
        )}
      </div>
      {allStaffTotals.length>0&&(
        <div style={{background:"#1E293B",padding:"10px 20px",display:"flex",flexWrap:"wrap",gap:8,flexShrink:0,borderBottom:"2px solid #334155"}}>
          <span style={{fontSize:10,fontWeight:700,color:"#94A3B8",alignSelf:"center",marginRight:2}}>합계</span>
          <button onClick={function(){setFilter({...filter,staff:"all"});}}
            style={{display:"flex",alignItems:"center",gap:6,borderRadius:8,padding:"5px 12px",border:"none",cursor:"pointer",
              background:filter.staff==="all"?"#2563EB":"rgba(255,255,255,.07)"}}>
            <span style={{fontSize:11,fontWeight:700,color:filter.staff==="all"?"#fff":"#F1F5F9"}}>전체보기</span>
          </button>
          {allStaffTotals.map(function(s){var active=filter.staff===s.id;return(
            <button key={s.id} onClick={function(){setFilter({...filter,staff:active?"all":s.id});}}
              style={{display:"flex",alignItems:"center",gap:6,borderRadius:8,padding:"5px 12px",border:active?"1.5px solid "+s.color:"none",cursor:"pointer",
                background:active?s.color+"22":"rgba(255,255,255,.07)"}}>
              <span style={{width:8,height:8,borderRadius:"50%",background:s.color,display:"inline-block"}}/>
              <span style={{fontSize:11,fontWeight:600,color:"#F1F5F9"}}>{s.name}</span>
              <span className="ml-mono" style={{fontSize:11,color:"#94A3B8"}}>·</span>
              <span className="ml-mono" style={{fontSize:11,fontWeight:700,color:"#7DD3FC"}}>{fmtHours(s.hours)}</span>

      <div className="tbl-wrap">
        {filtered.length===0?<div style={{padding:40,textAlign:"center",fontSize:12,color:"#94A3B8"}}>근무 기록이 없어요.</div>:(

                <th className="sort-btn" onClick={function(){toggleSort("startAt");}} style={{padding:"10px 14px",textAlign:"left",fontWeight:600,whiteSpace:"nowrap"}}><span style={{display:"inline-flex",alignItems:"center",gap:4}}>날짜 <SI k="startAt"/></span></th>

                <th style={{padding:"10px 14px",textAlign:"left",fontWeight:600,whiteSpace:"nowrap"}}>출근</th>

function CompletedOrdersView({items,orders}){

      if(o.status!=="완료")return false;
      if(filterStore!=="all"&&o.storeId!==filterStore)return false;
      if(filterItem!=="all"&&o.itemId!==filterItem)return false;
      if(filterFrom&&o.changedAt&&o.changedAt.slice(0,10)<filterFrom)return false;
      if(filterTo&&o.changedAt&&o.changedAt.slice(0,10)>filterTo)return false;
      return true;
    }).sort(function(a,b){return b.changedAt>a.changedAt?1:-1;}).slice(0,2000);

  return(
    <div style={{display:"flex",flexDirection:"column",flex:1,overflow:"hidden"}}>

          <option value="all">전체 품목</option>

        </select>
        <span style={{fontSize:10,color:"#94A3B8"}}>기간</span>

          style={{padding:"5px 8px",border:"1px solid #CBD5E1",borderRadius:6,fontSize:11,outline:"none"}}/>
        <span style={{fontSize:10,color:"#94A3B8"}}>~</span>

      <div className="tbl-wrap">
        {completedOrders.length===0?(
          <div style={{padding:40,textAlign:"center",fontSize:12,color:"#94A3B8"}}>완료된 주문이 없어요.</div>
        ):(
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>
            <thead>
              <tr style={{background:"#334155",color:"#E2E8F0"}}>

// ── OrderStatusView (통합 주문현황: 발주/주문/수령 모두 한 화면) ──
function OrderStatusView({items,orders,onUpdateOrderStatus,onDeleteOrders}){
  var [filterStore,setFilterStore]=useState("all"); // all | 미플 | 아카이브
  var [filterStatus,setFilterStatus]=useState("all"); // all | 발주 | 주문 | 수령
  var [filterUrgent,setFilterUrgent]=useState(false);
  var [checked,setChecked]=useState(new Set());
  var [confirming,setConfirming]=useState(null); // "next" | "prev" | "delete" | null

  var ACTIVE_STATUSES=STATUSES.filter(function(s){return s.id!=="완료";}); // 완료는 별도 탭

  function itemName(itemId){var it=items.find(function(x){return x.id===itemId;});return it?it.name:itemId;}
  function itemOf(itemId){return items.find(function(x){return x.id===itemId;});}

  var filteredOrders=useMemo(function(){
    var l=orders.filter(function(o){return o.status!=="완료";});
    if(filterStore!=="all")l=l.filter(function(o){return o.storeId===filterStore;});
    if(filterStatus!=="all")l=l.filter(function(o){return o.status===filterStatus;});
    if(filterUrgent)l=l.filter(function(o){return o.isUrgent;});
    return [...l].sort(function(a,b){
      var at=a.requestedAt||a.changedAt||"";
      var bt=b.requestedAt||b.changedAt||"";
      if(at!==bt)return bt>at?1:-1;
      var an=itemName(a.itemId),bn=itemName(b.itemId);
      return an.localeCompare(bn,"ko");
    });
  },[orders,filterStore,filterStatus,filterUrgent]);

  function toggleCheck(id){setChecked(function(prev){var n=new Set(prev);n.has(id)?n.delete(id):n.add(id);return n;});}
  function toggleAll(){checked.size===filteredOrders.length&&filteredOrders.length>0?setChecked(new Set()):setChecked(new Set(filteredOrders.map(function(o){return o.id;})));}

  var checkedOrders=useMemo(function(){return filteredOrders.filter(function(o){return checked.has(o.id);});},[filteredOrders,checked]);

  var duplicateKeys=useMemo(function(){
    var counts={};
    filteredOrders.forEach(function(o){
      var k=o.storeId+"_"+o.itemId;
      counts[k]=(counts[k]||0)+1;
    });
    var dup=new Set();
    Object.keys(counts).forEach(function(k){if(counts[k]>1)dup.add(k);});
    return dup;
  },[filteredOrders]);
  function isDuplicate(o){return duplicateKeys.has(o.storeId+"_"+o.itemId);}

  var allSameStatus=checkedOrders.length>0&&checkedOrders.every(function(o){return o.status===checkedOrders[0].status;});
  var nextStatusCfg=allSameStatus?statusCfg(statusCfg(checkedOrders[0].status).next):null;
  var canGoPrev=allSameStatus&&checkedOrders.length>0&&!!prevStatus(checkedOrders[0].status);
  var prevStatusId=canGoPrev?prevStatus(checkedOrders[0].status):null;
  var prevStatusCfg2=prevStatusId?statusCfg(prevStatusId):null;

  function confirmMove(){
    checkedOrders.forEach(function(o){onUpdateOrderStatus(o.id,statusCfg(o.status).next,o.status);});
    setChecked(new Set());
    setConfirming(null);
  }
  function confirmMovePrev(){
    if(!prevStatusId)return;
    checkedOrders.forEach(function(o){onUpdateOrderStatus(o.id,prevStatusId,o.status);});
    setChecked(new Set());
    setConfirming(null);
  }
  function confirmDelete(){
    var ids=checkedOrders.map(function(o){return o.id;});
    onDeleteOrders(ids).then(function(){
      setChecked(new Set());
      setConfirming(null);
    }).catch(function(e){alert("삭제 실패: "+e.message);});
  }

  return(
    <div style={{display:"flex",flexDirection:"column",flex:1,overflow:"hidden"}}>
      <div style={{background:"#F8FAFC",borderBottom:"1px solid #E2E8F0",padding:"10px 16px",display:"flex",flexWrap:"wrap",alignItems:"center",gap:8,flexShrink:0}}>
        <select value={filterStore} onChange={function(e){setFilterStore(e.target.value);setChecked(new Set());}}
          style={{padding:"6px 10px",border:"1px solid #CBD5E1",borderRadius:6,fontSize:11,outline:"none",background:"#fff",color:"#1E293B"}}>
          <option value="all">전체 매장</option>
          {STORES.map(function(s){return <option key={s.id} value={s.id}>{s.id}</option>;})}
        </select>
        <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
          <button onClick={function(){setFilterStatus("all");setChecked(new Set());}}
            style={{padding:"5px 12px",borderRadius:999,fontSize:11,fontWeight:600,cursor:"pointer",whiteSpace:"nowrap",
              border:"1.5px solid "+(filterStatus==="all"?"#334155":"#E2E8F0"),
              background:filterStatus==="all"?"#334155":"#fff",
              color:filterStatus==="all"?"#fff":"#94A3B8"}}>
            전체
          </button>
          {ACTIVE_STATUSES.map(function(st){var active=filterStatus===st.id;return(
            <button key={st.id} onClick={function(){setFilterStatus(active?"all":st.id);setChecked(new Set());}}
              style={{padding:"5px 12px",borderRadius:999,fontSize:11,fontWeight:600,cursor:"pointer",whiteSpace:"nowrap",
                border:"1.5px solid "+(active?st.dot:"#E2E8F0"),
                background:active?st.bg:"#fff",
                color:active?st.color:"#94A3B8"}}>
              {st.id}
            </button>
          );})}
        </div>
        <button onClick={function(){setFilterUrgent(!filterUrgent);setChecked(new Set());}}
          style={{padding:"5px 12px",borderRadius:999,fontSize:11,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap",
            border:"1.5px solid "+(filterUrgent?"#DC2626":"#E2E8F0"),
            background:filterUrgent?"#FEE2E2":"#fff",
            color:filterUrgent?"#991B1B":"#94A3B8"}}>
          🚨 긴급만
        </button>
        <span className="ml-mono" style={{fontSize:10,color:"#94A3B8"}}>{filteredOrders.length}건</span>
        <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:6}}>
          {checked.size>0&&<span style={{fontSize:10,color:"#64748B",fontWeight:600}}>{checked.size}개 선택</span>}
          <button onClick={function(){
              if(checked.size===0){alert("항목을 선택해주세요.");return;}
              setConfirming("delete");
            }}
            style={{padding:"6px 10px",borderRadius:999,fontSize:11,fontWeight:600,cursor:checked.size>0?"pointer":"not-allowed",
              border:"1.5px solid "+(checked.size>0?"#FECACA":"#E2E8F0"),
              background:checked.size>0?"#FEF2F2":"#F1F5F9",
              color:checked.size>0?"#DC2626":"#CBD5E1"}}>
            삭제
          </button>
          <button onClick={function(){
              if(checked.size===0){alert("항목을 선택해주세요.");return;}
              if(!allSameStatus){alert("같은 상태의 항목만 함께 이동할 수 있어요.");return;}
              if(!canGoPrev){alert("더 이전 단계가 없어요.");return;}
              setConfirming("prev");
            }}
            style={{padding:"6px 12px",borderRadius:999,fontSize:11,fontWeight:600,cursor:(checked.size>0&&canGoPrev)?"pointer":"not-allowed",
              border:"1.5px solid "+(prevStatusCfg2?prevStatusCfg2.dot:"#E2E8F0"),
              background:prevStatusCfg2?(prevStatusCfg2.bg||"#fff"):"#F1F5F9",
              color:prevStatusCfg2?prevStatusCfg2.color:"#CBD5E1"}}>
            ← {prevStatusCfg2?prevStatusCfg2.id:"이전 단계"}로
          </button>
          <button onClick={function(){
              if(checked.size===0){alert("항목을 선택해주세요.");return;}
              if(!allSameStatus){alert("같은 상태의 항목만 함께 이동할 수 있어요.");return;}
              setConfirming("next");
            }}
            style={{padding:"6px 14px",borderRadius:999,fontSize:11,fontWeight:600,cursor:checked.size>0?"pointer":"not-allowed",
              border:"1.5px solid "+(nextStatusCfg?nextStatusCfg.dot:"#E2E8F0"),
              background:nextStatusCfg?(nextStatusCfg.bg||"#fff"):"#F1F5F9",
              color:nextStatusCfg?nextStatusCfg.color:"#CBD5E1"}}>
            → {nextStatusCfg?nextStatusCfg.id:"다음 단계"}로 이동
          </button>
        </div>
      </div>

      <div className="tbl-wrap">
        {filteredOrders.length===0?(
          <div style={{padding:40,textAlign:"center",fontSize:12,color:"#94A3B8"}}>주문 내역이 없어요.</div>
        ):(
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:11,tableLayout:"fixed"}}>
            <colgroup><col style={{width:30}}/><col/><col style={{width:"22%"}}/><col style={{width:"22%"}}/><col style={{width:"22%"}}/></colgroup>
            <thead>
              <tr style={{background:"#334155",color:"#E2E8F0"}}>
                <th style={{padding:"9px 6px",textAlign:"center"}}>
                  <input type="checkbox" checked={filteredOrders.length>0&&checked.size===filteredOrders.length} onChange={toggleAll} style={{accentColor:"#3B82F6",cursor:"pointer"}}/>
                </th>
                <th style={{padding:"9px 8px",textAlign:"left",fontWeight:600}}>품목</th>
                <th style={{padding:"9px 8px",textAlign:"left",fontWeight:600}}>발주</th>
                <th style={{padding:"9px 8px",textAlign:"left",fontWeight:600}}>주문</th>
                <th style={{padding:"9px 8px",textAlign:"left",fontWeight:600}}>수령</th>
              </tr>
            </thead>
            <tbody>
              {filteredOrders.map(function(o,i){
                var b=storeBadge(o.storeId);
                var cfg=statusCfg(o.status);
                var isCk=checked.has(o.id);
                var isDup=isDuplicate(o);
                var rowBg=isCk?"#EFF6FF":(isDup?"#FED7AA":(o.isUrgent?"#FEF2F2":undefined));
                return(
                  <tr key={o.id} className={"ml-row "+(i%2===0?"even":"odd")} onClick={function(){toggleCheck(o.id);}} title={isDup?"같은 매장에 동일 물품이 여러 건 있어요":undefined} style={{cursor:"pointer"}}>
                    <td style={{padding:"8px 6px",textAlign:"center",background:rowBg}}>
                      <input type="checkbox" checked={isCk} onChange={function(){toggleCheck(o.id);}} onClick={function(e){e.stopPropagation();}} style={{accentColor:"#3B82F6",cursor:"pointer"}}/>
                    </td>
                    <td style={{padding:"8px 8px",fontWeight:600,color:"#1E293B",overflow:"hidden",background:rowBg}}>
                      <div style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",display:"flex",alignItems:"center",gap:4}}>
                        {o.isUrgent&&<span style={{fontSize:10,flexShrink:0}}>🚨</span>}
                        <span style={{overflow:"hidden",textOverflow:"ellipsis"}}>{itemName(o.itemId)}</span>
                      </div>
                      <div style={{display:"flex",gap:3,flexWrap:"wrap",marginTop:3}}>
                        {o.isUrgent&&<span className="tag" style={{background:"#FEE2E2",color:"#991B1B",fontSize:9,fontWeight:700}}>긴급</span>}
                        <span className="tag" style={{background:b.bg,color:b.color,fontSize:9}}>{o.storeId}</span>
                        <span className="tag" style={{background:cfg.bg,color:cfg.color,fontSize:9}}>{o.status}</span>
                      </div>
                      {o.memo&&<div style={{fontSize:9,color:"#94A3B8",fontWeight:400,marginTop:3,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{o.memo}</div>}
                    </td>
                    <td style={{padding:"8px 8px",overflow:"hidden",background:rowBg}}>
                      {o.requestedBy?(
                        <>
                          <div style={{color:"#7C3AED",fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{staffName(o.requestedBy)}</div>
                          <div className="ml-mono" style={{fontSize:9,color:"#94A3B8",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{o.requestedAt?fmtDateTime(o.requestedAt):(o.status==="발주"?fmtDateTime(o.changedAt):"")}</div>
                        </>
                      ):<span style={{color:"#CBD5E1"}}>—</span>}
                    </td>
                    <td style={{padding:"8px 8px",overflow:"hidden",background:rowBg}}>
                      {o.orderedBy?(
                        <>
                          <div style={{color:"#1E40AF",fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{staffName(o.orderedBy)}</div>
                          <div className="ml-mono" style={{fontSize:9,color:"#94A3B8",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{o.orderedAt?fmtDateTime(o.orderedAt):""}</div>
                        </>
                      ):<span style={{color:"#CBD5E1"}}>—</span>}
                    </td>
                    <td style={{padding:"8px 8px",overflow:"hidden",background:rowBg}}>
                      {o.completedBy?(
                        <>
                          <div style={{color:"#059669",fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{staffName(o.completedBy)}</div>
                          <div className="ml-mono" style={{fontSize:9,color:"#94A3B8",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{o.completedAt?fmtDateTime(o.completedAt):(o.status==="수령"?fmtDateTime(o.changedAt):"")}</div>
                        </>
                      ):<span style={{color:"#CBD5E1"}}>—</span>}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        )}
      </div>

      {confirming&&(
        <div className="modal-overlay" onClick={function(e){if(e.target===e.currentTarget)setConfirming(null);}}>
          <div className="modal-box fade-in" style={{padding:24,color:"#1E293B"}}>
            <h2 style={{fontSize:15,fontWeight:700,marginBottom:12}}>
              {confirming==="next"&&("선택한 "+checkedOrders.length+"개 항목을 ["+(nextStatusCfg?nextStatusCfg.id:"")+"]로 변경하시겠습니까?")}
              {confirming==="prev"&&("선택한 "+checkedOrders.length+"개 항목을 ["+(prevStatusCfg2?prevStatusCfg2.id:"")+"]로 되돌리시겠습니까?")}
              {confirming==="delete"&&("선택한 "+checkedOrders.length+"개 항목을 삭제하시겠습니까? 이 작업은 되돌릴 수 없어요.")}
            </h2>
            <div style={{background:"#F8FAFC",borderRadius:8,padding:"12px 14px",marginBottom:20,maxHeight:220,overflowY:"auto",border:"1px solid #E2E8F0"}}>
              {checkedOrders.map(function(o){return(
                <div key={o.id} style={{fontSize:12,color:"#374151",padding:"3px 0"}}>· {itemName(o.itemId)} ({o.storeId})</div>
              );})}
            </div>
            <div style={{display:"flex",justifyContent:"flex-end",gap:8}}>
              <button onClick={function(){setConfirming(null);}} style={{padding:"8px 16px",border:"1px solid #CBD5E1",borderRadius:6,fontSize:12,color:"#64748B",background:"#fff",cursor:"pointer"}}>취소</button>
              {confirming==="next"&&<button onClick={confirmMove} style={{padding:"8px 18px",background:"#2563EB",color:"#fff",borderRadius:6,fontSize:12,border:"none",cursor:"pointer",fontWeight:600}}>확인</button>}
              {confirming==="prev"&&<button onClick={confirmMovePrev} style={{padding:"8px 18px",background:"#64748B",color:"#fff",borderRadius:6,fontSize:12,border:"none",cursor:"pointer",fontWeight:600}}>확인</button>}
              {confirming==="delete"&&<button onClick={confirmDelete} style={{padding:"8px 18px",background:"#DC2626",color:"#fff",borderRadius:6,fontSize:12,border:"none",cursor:"pointer",fontWeight:600}}>삭제</button>}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}


// ── OrderView ──
function OrderView({items,orders,orderCategories,currentUser,onItemClick,onAddItem,onAddOrder,onUpdateOrderStatus,onDeleteOrders,onManageOrderCategories}){
  var [orderTab,setOrderTab]=useState("status"); // list | status | completed
  var [search,setSearch]=useState("");
  var [filterCat,setFilterCat]=useState("all");
  var [checked,setChecked]=useState(new Set());
  var [confirmStore,setConfirmStore]=useState(null); // "미플" | "아카이브" | null

  function catName(id){var c=orderCategories.find(function(x){return x.id===id;});return c?c.name:null;}
  function catOrder(id){var c=orderCategories.find(function(x){return x.id===id;});return c?c.sortOrder:999999;}

  var filteredItems=useMemo(function(){
    var l=items;
    if(search.trim())l=l.filter(function(it){return it.name.toLowerCase().indexOf(search.trim().toLowerCase())>=0;});
    if(filterCat!=="all")l=l.filter(function(it){return(it.categoryId||"")===(filterCat==="none"?"":filterCat);});
    return [...l].sort(function(a,b){
      var ao=a.categoryId?catOrder(a.categoryId):999998;
      var bo=b.categoryId?catOrder(b.categoryId):999998;
      if(ao!==bo)return ao-bo;
      return a.name.localeCompare(b.name,"ko");
    });
  },[items,search,filterCat,orderCategories]);

  var searchedItems=useMemo(function(){
    var l=items;
    if(search.trim())l=l.filter(function(it){return it.name.toLowerCase().indexOf(search.trim().toLowerCase())>=0;});
    return l;
  },[items,search]);
  var categoryCounts=useMemo(function(){
    var m={};
    orderCategories.forEach(function(c){m[c.id]=0;});
    var noneCount=0;
    searchedItems.forEach(function(it){
      if(it.categoryId&&m[it.categoryId]!==undefined)m[it.categoryId]++;
      else noneCount++;
    });
    return{byId:m,none:noneCount};
  },[searchedItems,orderCategories]);

  var [collapsedCats,setCollapsedCats]=useState(new Set());
  var [collapsedInit,setCollapsedInit]=useState(false);
  useEffect(function(){
    if(collapsedInit)return;
    if(orderCategories.length===0)return;
    setCollapsedCats(new Set(orderCategories.map(function(c){return c.id;}).concat(["__none__"])));
    setCollapsedInit(true);
  },[orderCategories,collapsedInit]);
  function toggleCollapse(key){setCollapsedCats(function(prev){var n=new Set(prev);n.has(key)?n.delete(key):n.add(key);return n;});}

  var groupedItems=useMemo(function(){
    var byCat={};
    var noneItems=[];
    filteredItems.forEach(function(it){
      if(it.categoryId){
        if(!byCat[it.categoryId])byCat[it.categoryId]=[];
        byCat[it.categoryId].push(it);
      }else{
        noneItems.push(it);
      }
    });
    var groups=orderCategories
      .filter(function(c){return byCat[c.id]&&byCat[c.id].length>0;})
      .map(function(c){return{key:c.id,name:c.name,items:byCat[c.id]};});
    if(noneItems.length>0)groups.push({key:"__none__",name:"카테고리 없음",items:noneItems});
    return groups;
  },[filteredItems,orderCategories]);

  function toggleCheck(id){setChecked(function(prev){var n=new Set(prev);n.has(id)?n.delete(id):n.add(id);return n;});}
  function toggleAll(){checked.size===filteredItems.length&&filteredItems.length>0?setChecked(new Set()):setChecked(new Set(filteredItems.map(function(i){return i.id;})));}

  var checkedItems=useMemo(function(){
    return items.filter(function(it){return checked.has(it.id);});
  },[items,checked]);

  var [urgentItems,setUrgentItems]=useState(new Set());

  function toggleUrgent(id){setUrgentItems(function(prev){var n=new Set(prev);n.has(id)?n.delete(id):n.add(id);return n;});}

  function confirmOrder(){
    if(!confirmStore)return;
    checkedItems.forEach(function(it){onAddOrder(it,confirmStore,urgentItems.has(it.id));});
    setChecked(new Set());
    setConfirmStore(null);
    setUrgentItems(new Set());
  }

  var ORDER_TABS=[
    {id:"list",label:"상품 발주"},
    {id:"status",label:"주문현황"},
    {id:"completed",label:"완료된 주문"},
  ];

  return(
    <div style={{display:"flex",flexDirection:"column",flex:1,overflow:"hidden"}}>

      {/* 최상위 서브탭 */}
      <div style={{background:"#F1F5F9",borderBottom:"1px solid #E2E8F0",padding:"0 16px",display:"flex",gap:2,alignItems:"flex-end",flexShrink:0,overflowX:"auto",WebkitOverflowScrolling:"touch"}}>
        {ORDER_TABS.map(function(t){return(
          <button key={t.id} onClick={function(){setOrderTab(t.id);}}
            style={{display:"inline-flex",alignItems:"center",gap:5,padding:"8px 14px",fontSize:11,fontWeight:600,border:"none",cursor:"pointer",borderRadius:"8px 8px 0 0",whiteSpace:"nowrap",flexShrink:0,
              background:orderTab===t.id?"#fff":"transparent",
              color:orderTab===t.id?"#1E293B":"#64748B",
              borderBottom:orderTab===t.id?"2px solid #334155":"2px solid transparent"}}>
            {t.label}
          </button>
        );})}
        {orderTab==="list"&&(
          <button onClick={onAddItem} style={{marginLeft:"auto",marginBottom:6,display:"inline-flex",alignItems:"center",gap:5,padding:"5px 12px",background:"#2563EB",color:"#fff",borderRadius:6,fontSize:10,fontWeight:600,border:"none",cursor:"pointer",whiteSpace:"nowrap",flexShrink:0}}><Plus size={11}/> 품목 추가</button>
        )}
      </div>

      {/* 상품 발주 탭 */}
      {orderTab==="list"&&(
        <>
          <div style={{background:"#F8FAFC",borderBottom:"1px solid #E2E8F0",padding:"8px 16px",display:"flex",flexWrap:"wrap",gap:8,alignItems:"center",flexShrink:0}}>
            <input value={search} onChange={function(e){setSearch(e.target.value);}} placeholder="품목명 검색…"
              style={{padding:"5px 10px",border:"1px solid #CBD5E1",borderRadius:6,fontSize:11,outline:"none",width:140}}/>
            <span className="ml-mono" style={{fontSize:10,color:"#94A3B8"}}>{filteredItems.length}개</span>
            {currentUser&&currentUser.isAdmin&&(
              <button onClick={onManageOrderCategories} style={{padding:"5px 10px",background:"#F8FAFC",color:"#374151",borderRadius:6,fontSize:10,fontWeight:600,border:"1px solid #E2E8F0",cursor:"pointer"}}>카테고리 관리</button>
            )}
            <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:8}}>
              {checked.size>0&&<span style={{fontSize:10,color:"#64748B",fontWeight:600}}>{checked.size}개 선택</span>}
              {STORES.map(function(s){var b=s.badge;return(
                <button key={s.id} onClick={function(){if(checked.size===0){alert("품목을 선택해주세요.");return;}setConfirmStore(s.id);}}
                  style={{padding:"6px 14px",borderRadius:999,fontSize:11,fontWeight:600,border:"1.5px solid "+b.color,background:checked.size>0?b.bg:"#F8FAFC",color:checked.size>0?b.color:"#CBD5E1",cursor:checked.size>0?"pointer":"not-allowed"}}>
                  {s.id} 주문
                </button>
              );})}
            </div>
          </div>
          {orderCategories.length>0&&(
            <div style={{background:"#1E293B",padding:"10px 16px",display:"flex",flexWrap:"wrap",gap:8,flexShrink:0,borderBottom:"2px solid #334155"}}>
              <button onClick={function(){setFilterCat("all");}}
                style={{display:"flex",alignItems:"center",gap:6,borderRadius:8,padding:"5px 12px",border:"none",cursor:"pointer",
                  background:filterCat==="all"?"#2563EB":"rgba(255,255,255,.07)"}}>
                <span style={{fontSize:11,fontWeight:700,color:filterCat==="all"?"#fff":"#F1F5F9"}}>전체보기</span>
              </button>
              {orderCategories.map(function(c){var active=filterCat===c.id;var cnt=categoryCounts.byId[c.id]||0;return(
                <button key={c.id} onClick={function(){setFilterCat(active?"all":c.id);}}
                  style={{display:"flex",alignItems:"center",gap:6,borderRadius:8,padding:"5px 12px",border:active?"1.5px solid #7DD3FC":"none",cursor:"pointer",
                    background:active?"#7DD3FC22":"rgba(255,255,255,.07)"}}>
                  <span style={{fontSize:11,fontWeight:600,color:"#F1F5F9"}}>{c.name}</span>
                  <span className="ml-mono" style={{fontSize:11,color:"#94A3B8"}}>·</span>
                  <span className="ml-mono" style={{fontSize:11,fontWeight:700,color:"#7DD3FC"}}>{cnt}개</span>
                </button>
              );})}
              {categoryCounts.none>0&&(
                <button onClick={function(){setFilterCat(filterCat==="none"?"all":"none");}}
                  style={{display:"flex",alignItems:"center",gap:6,borderRadius:8,padding:"5px 12px",border:filterCat==="none"?"1.5px solid #94A3B8":"none",cursor:"pointer",
                    background:filterCat==="none"?"#94A3B822":"rgba(255,255,255,.07)"}}>
                  <span style={{fontSize:11,fontWeight:600,color:"#F1F5F9"}}>카테고리 없음</span>
